<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark">
  <title>Project Checker</title>

  <!-- Inline SVG favicon: blue circle with green center -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%236c8cff'/><circle cx='50' cy='50' r='25' fill='%2334d399'/></svg>" />

  <!-- Pico.css — custom styles.css overrides it where needed -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />

  <!-- External CSS (separate file for caching and readability) -->
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <div id="app"></div>
  <div id="toast" aria-live="polite"></div>

  <!-- Vue 3 CDN (production build, no dev warnings) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <script>
    /* ─────────────────────────────────────────────────────────────────────────
       Vue 3 CDN — API is defined at module scope and exposed on window so
       templates can call api.* directly via the returned `api: window.api`.
    ───────────────────────────────────────────────────────────────────────── */

    // Pull only what we need from the global Vue object
    const { createApp, ref, computed, onMounted, onUnmounted, watch, Transition } = Vue;

    /* ── API layer ───────────────────────────────────────────────────────────────
       Thin wrapper around fetch(). All calls go to /api/* on the same host.
       live-server proxies /api → Express on port 3000 during development.
    ───────────────────────────────────────────────────────────────────────── */
    const BASE = '/api';

    /**
     * Make an HTTP request to the Express API.
     * @param {string} path  - e.g. '/projects' or '/projects/5'
     * @param {object} opts  - fetch options: { method, headers, body, ... }
     */
    async function req(path, opts = {}) {
      const r = await fetch(BASE + path, {
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      if (!r.ok) {
        // Try to extract { error: "..." } from the JSON body
        let d = '';
        try { d = (await r.json()).error || r.statusText; } catch { d = r.statusText; }
        throw new Error(d);
      }
      return r.json();
    }

    /** All API methods — one per backend endpoint */
    const api = {
      getDashboard:   ()       => req('/dashboard'),
      listProjects:   ()       => req('/projects'),
      getProject:     (id)     => req(`/projects/${id}`),
      createProject:  (d)      => req('/projects',            { method: 'POST',   body: JSON.stringify(d) }),
      updateProject:  (id, d)  => req(`/projects/${id}`,     { method: 'PUT',    body: JSON.stringify(d) }),
      deleteProject:  (id)     => req(`/projects/${id}`,     { method: 'DELETE' }),
      refreshRepos:   (id)     => req(`/projects/${id}/refresh-repos`, { method: 'POST' }),
      checkWebsite:   (id)     => req(`/projects/${id}/check-website`,  { method: 'POST' }),
      confirmWebsite: (id)     => req(`/projects/${id}/confirm-website`,{ method: 'POST' }),
      checkGithub:    (id)     => req(`/projects/${id}/check-github`,   { method: 'POST' }),
      checkTwitter:   (id)     => req(`/projects/${id}/check-twitter`,  { method: 'POST' }),
      confirmTwitter: (id)     => req(`/projects/${id}/confirm-twitter`,{ method: 'POST' }),
      getCheckLogs:   (q = {}) => req('/check-logs?' + new URLSearchParams(q).toString()),
      getSettings:    ()       => req('/settings'),
      updateSettings: (d)      => req('/settings',           { method: 'PUT',    body: JSON.stringify(d) }),
      triggerAll:     ()       => req('/settings/trigger-all',   { method: 'POST' }),
      triggerWebsites: ()     => req('/settings/trigger-websites', { method: 'POST' }),
      triggerGithub:   ()     => req('/settings/trigger-github',  { method: 'POST' }),
      triggerTwitter:  ()     => req('/settings/trigger-twitter',  { method: 'POST' }),
      clearData:      ()       => req('/settings/clear-data',   { method: 'POST' }),
      clearLogs:      ()       => req('/settings/clear-logs',   { method: 'POST' }),
    };

    // Expose globally so the template can call api.* after we return api: window.api
    window.api = api;

    /** Show a toast notification in the bottom-right corner */
    function showToast(msg, type = 'ok') {
      const el = document.createElement('div');
      el.className = `toast-msg ${type}`;
      el.textContent = msg;
      document.getElementById('toast').appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }
    window.showToast = showToast;

    /* ── Shared helpers ─────────────────────────────────────────────────────────
       Used directly in templates via Vue's template expression evaluation.
    ───────────────────────────────────────────────────────────────────────── */

    /** Format a timestamp as a human-readable relative string: "3 hours ago" */
    const RTF = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
    const UNITS = [
      ['year',   31536e3],
      ['month',  2592e3],
      ['week',   604800],
      ['day',    86400],
      ['hour',   3600],
      ['minute', 60],
      ['second', 1],
    ];

    function relativeTime(v) {
      if (!v) return 'never';
      const d = new Date(v);
      if (isNaN(d)) return 'never';
      const diff = (d.getTime() - Date.now()) / 1000;
      for (const [u, s] of UNITS)
        if (Math.abs(diff) >= s || u === 'second') return RTF.format(Math.round(diff / s), u);
      return 'just now';
    }

    /** Format a timestamp as an absolute date+time string: "Jun 30, 2026, 5:00 PM" */
    function absoluteTime(v) {
      if (!v) return '—';
      const d = new Date(v);
      if (isNaN(d)) return '—';
      return new Intl.DateTimeFormat('en', { dateStyle: 'medium', timeStyle: 'short' }).format(d);
    }

    /** Extract the hostname from a URL, stripping leading "www." */
    /**
     * Extract a human-readable label from a URL, tailored to each platform.
     * - Website → hostname only (e.g. "autonaisol.xyz")
     * - GitHub  → org/user path (e.g. "auton-ai")
     * - Twitter / X → handle (e.g. "auton_ai")
     * - Telegram → channel/handle (e.g. "auton_ai")
     */
    function urlLabel(u) {
      if (!u) return null;
      try {
        const url = new URL(u);
        const h = url.hostname.replace(/^www\./, '');
        if (h === 'github.com' || h === 'www.github.com') return url.pathname.replace(/^\//, '').split('/')[0] || null;
        if (h === 'x.com' || h === 'www.x.com' || h === 'twitter.com' || h === 'www.twitter.com') return url.pathname.replace(/^\//, '') || null;
        if (h === 't.me' || h === 'www.t.me') return url.pathname.replace(/^\//, '') || null;
        return h; // websites: just the hostname
      } catch { return u; }
    }

    /** Format check_logs.details for display */
    function logDetail(d) {
      if (!d) return '—';
      try { const p = typeof d === 'string' ? JSON.parse(d) : d; if (p.content_hash) return 'content changed (' + p.content_hash.slice(0, 8) + '…)'; } catch (_) {}
      return typeof d === 'string' ? d : JSON.stringify(d);
    }

    /** Map a raw status string → CSS class name for the badge */
    function statusClass(s) {
      if (s === 'ok' || s === 'success') return 'ok';
      if (s === 'error' || s === 'failed') return 'error';
      if (s === 'changed') return 'changed';
      return 'pending';
    }

    /* ── NavBar component ──────────────────────────────────────────────────────
       Sticky top bar with a brand mark and navigation tabs.
       currentRoute is a ref that updates whenever the hash changes,
       causing Vue to re-evaluate the :class binding on each tab.
    ───────────────────────────────────────────────────────────────────────── */
    const NavBar = {
      template: `
        <nav class="navbar">
          <ul>
            <li>
              <span class="brand">
                <span class="logo-dot"></span>
                Project Checker
              </span>
            </li>
          </ul>
          <ul>
            <li v-for="t in leftTabs" :key="t.to">
              <a
                :href="'#' + t.to"
                :aria-current="currentRoute === t.to ? 'page' : undefined"
              >{{ t.label }}</a>
            </li>
          </ul>
          <ul>
            <li v-for="t in rightTabs" :key="t.to">
              <a
                :href="'#' + t.to"
                :aria-current="currentRoute === t.to ? 'page' : undefined"
              >{{ t.label }}</a>
            </li>
          </ul>
        </nav>
      `,

      setup() {
        // Read initial hash route, e.g. '' → '/', '/projects' → '/projects'
        const currentRoute = ref(window.location.hash.slice(1) || '/');

        // Re-read hash whenever the URL fragment changes (SPA navigation)
        window.addEventListener('hashchange', () => {
          currentRoute.value = window.location.hash.slice(1) || '/';
        });

        return {
          leftTabs: [
            { to: '/',         label: 'Activity'  },
            { to: '/projects', label: 'Projects'  },
          ],
          rightTabs: [
            { to: '/settings', label: 'Settings'  },
          ],
          currentRoute,
        };
      },
    };

    /* ── RepoList component ────────────────────────────────────────────────────
       Renders a list of GitHub repositories attached to a project.
       Props: repos (array from project.repos)
    ───────────────────────────────────────────────────────────────────────── */
    const RepoList = {
      props: ['repos'],

      template: `
        <div>
          <div v-if="!repos.length" class="muted">No repositories linked.</div>

          <ul v-else class="repo-list">
            <li v-for="r in repos" :key="r.id || r.full_name" class="repo">
              <!-- Repo name / link (use repo_url if set, otherwise build from full_name) -->
              <div class="repo-name">
                <a :href="r.repo_url || 'https://github.com/' + r.full_name" target="_blank" rel="noopener">
                  {{ r.full_name }}
                </a>
              </div>

              <!-- Latest commit info row -->
              <div class="repo-meta">
                <template v-if="r.latest_commit_sha">
                  <!-- Short SHA link to commit on GitHub -->
                  <a
                    :href="(r.repo_url || 'https://github.com/' + r.full_name) + '/commit/' + r.latest_commit_sha"
                    target="_blank" rel="noopener" class="sha"
                  >{{ r.latest_commit_sha.slice(0, 7) }}</a>

                  <span v-if="r.latest_commit_message" class="msg">
                    {{ r.latest_commit_message }}
                  </span>

                  <span v-if="r.latest_commit_date" class="muted">
                    · {{ relativeTime(r.latest_commit_date) }}
                  </span>
                </template>
                <span v-else class="muted">no commits yet</span>
              </div>
            </li>
          </ul>
        </div>
      `,

      // Expose helpers to the template
      methods: { relativeTime },
    };

    /* ── CheckLogList component ───────────────────────────────────────────────
       Renders a table of recent check log entries.
       Props: logs (array), showProject (bool — show project name column)
    ───────────────────────────────────────────────────────────────────────── */
    const CheckLogList = {
      props: ['logs', 'showProject'],

      template: `
        <div>
          <div v-if="!logs.length" class="muted">No check logs yet.</div>

          <table v-else>
            <thead>
              <tr>
                <th>Type</th>
                <th v-if="showProject">Project</th>
                <th>Status</th>
                <th>When</th>
                <th>Detail</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="log in logs" :key="log.id">
                <td>{{ log.resource_type }}</td>
                <td v-if="showProject">{{ log.project_name || log.project_id }}</td>
                <td>
                  <span :class="['badge', statusClass(log.status)]">
                    <span class="dot"></span>{{ log.status }}
                  </span>
                </td>
                <td>
                  <!-- absolute time on hover, relative in cell -->
                  <span :title="absoluteTime(log.checked_at)">
                    {{ showProject ? absoluteTime(log.checked_at) : relativeTime(log.checked_at) }}
                  </span>
                </td>
                <td class="detail">{{ logDetail(log.detail) }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      `,

      methods: { relativeTime, absoluteTime, statusClass, logDetail },
    };

    /* ── ProjectForm component ─────────────────────────────────────────────────
       Modal form for creating or editing a project.
       Props:   initial (project object — null for create)
                busy    (bool — disable submit while saving)
       Emits:   submit  (validated project data)
                cancel  (user clicked Cancel)
    ───────────────────────────────────────────────────────────────────────── */
    const ProjectForm = {
      props: ['initial', 'busy'],
      emits: ['submit', 'cancel'],

      template: `
        <div class="modal">
          <h2>{{ initial ? 'Edit Project' : 'New Project' }}</h2>

          <div class="form-group">
            <label>Name *</label>
            <input v-model="f.name" required placeholder="My Project" />
          </div>

          <div class="form-group">
            <label>Website URL</label>
            <input v-model="f.website_url" type="url" placeholder="https://example.com" />
          </div>

          <div class="form-group">
            <label>GitHub URL <span class="muted">(optional)</span></label>
            <input v-model="f.github_url" type="url" placeholder="https://github.com/org" />
          </div>

          <div class="form-group">
            <label>Twitter URL</label>
            <input v-model="f.twitter_url" type="url" placeholder="https://twitter.com/handle" />
          </div>

          <div class="form-group">
            <label>Telegram URL <span class="muted">(optional)</span></label>
            <input v-model="f.telegram_url" type="url" placeholder="https://t.me/channel" />
          </div>

          <div class="modal-actions">
            <button type="button" @click="$emit('cancel')">Cancel</button>
            <button type="button" class="primary" :disabled="busy" @click="onSubmit()">
              <span v-if="busy" class="spinner"></span>
              <span v-else>{{ initial ? 'Save' : 'Create' }}</span>
            </button>
          </div>
        </div>
      `,

      setup(props, { emit }) {
        // Local form state — starts empty or pre-filled with initial values
        const f = ref({
          name: '', website_url: '', github_url: '', twitter_url: '', telegram_url: '',
        });

        // Sync form fields whenever the `initial` prop changes
        // (happens when switching from "create" to "edit" mode)
        watch(
          () => props.initial,
          (v) => {
            if (v) {
              f.value = {
                name:         v.name         || '',
                website_url:   v.website_url   || '',
                github_url:   v.github_url    || '',
                twitter_url:  v.twitter_url   || '',
                telegram_url: v.telegram_url  || '',
              };
            } else {
              f.value = { name: '', website_url: '', github_url: '', twitter_url: '', telegram_url: '' };
            }
          },
          { immediate: true }
        );

        function onSubmit() {
          // Convert empty strings → null so the DB gets real NULLs
          const p = { ...f.value };
          for (const k of Object.keys(p)) {
            if (p[k] === '') p[k] = null;
          }
          if (!p.name) { alert('Name is required'); return; }
          emit('submit', p);
        }

        return { f, onSubmit };
      },
    };

    /* ── ProjectCard component ─────────────────────────────────────────────────
       A single project summary shown on the Activity page.
       Displays current status for website / GitHub / Twitter and a repo list.
       Emits 'refreshed' after any manual check completes so the parent can reload.
    ───────────────────────────────────────────────────────────────────────── */
    const ProjectCard = {
      props: ['project'],
      emits: ['refreshed'],
      components: { RepoList },

      template: `
        <article class="project-card">

          <!-- Card header: project name only -->
          <header class="head">
            <h2 class="name">{{ project.name }}</h2>
          </header>

          <!-- Status badges row: Twitter, Website, GitHub -->
          <table>
            <thead>
              <tr>
                <th scope="col">Resource</th>
                <th scope="col">Status</th>
                <th scope="col">Last Checked</th>
                <th scope="col">Last Change</th>
              </tr>
            </thead>
            <tbody>
              <tr v-if="project.twitter_url">
                <td><a :href="project.twitter_url" target="_blank" rel="noopener">Twitter</a></td>
                <td><span :class="['badge', statusClass(twitter.status)]"><span class="dot"></span>{{ twitter.status || 'pending' }}</span></td>
                <td><span class="muted">{{ relativeTime(twitter.checked_at) }}</span></td>
                <td><span class="muted">{{ twitterLastChanged ? relativeTime(twitterLastChanged) : '—' }}</span></td>
              </tr>
              <tr v-else>
                <td>Twitter</td>
                <td colspan="3"><span class="muted">Not Set</span></td>
              </tr>

              <tr v-if="project.website_url">
                <td><a :href="project.website_url" target="_blank" rel="noopener">Website</a></td>
                <td><span :class="['badge', statusClass(website.status)]"><span class="dot"></span>{{ website.status || 'pending' }}</span></td>
                <td><span class="muted">{{ relativeTime(website.checked_at) }}</span></td>
                <td><span class="muted">{{ websiteLastChanged ? relativeTime(websiteLastChanged) : '—' }}</span></td>
              </tr>
              <tr v-else>
                <td>Website</td>
                <td colspan="3"><span class="muted">Not Set</span></td>
              </tr>

              <tr v-if="project.github_url">
                <td><a :href="project.github_url" target="_blank" rel="noopener">GitHub</a></td>
                <td><span :class="['badge', statusClass(github.status)]"><span class="dot"></span>{{ github.status || 'pending' }}</span></td>
                <td><span class="muted">{{ relativeTime(github.checked_at) }}</span></td>
                <td><span class="muted">{{ githubLastChanged ? relativeTime(githubLastChanged) : '—' }}</span></td>
              </tr>
              <tr v-else>
                <td>GitHub</td>
                <td colspan="3"><span class="muted">Not Set</span></td>
              </tr>
            </tbody>
          </table>

          <!-- GitHub repos section with refresh button -->
          <section class="repos-section">
            <div class="repos-head">
              <h3>Repositories</h3>
              <button
                v-if="project.github_url"
                class="secondary"
                :disabled="busy === 'repos'"
                @click="runCheck('repos', () => api.refreshRepos(project.id))"
              >
                <span v-if="busy === 'repos'" class="spinner"></span>
                <span v-else>↻ Refresh</span>
              </button>
            </div>
            <div class="repos-scroll">
              <RepoList :repos="project.repos || []" />
            </div>
          </section>

          <!-- Refresh action buttons: Twitter, Website, GitHub -->
          <section class="actions-row">
            <button
              v-if="project.twitter_url"
              class="secondary"
              :disabled="busy === 'twitter'"
              @click="runCheck('twitter', () => api.checkTwitter(project.id))"
            >
              <span v-if="busy === 'twitter'" class="spinner"></span>
              <span v-else>↻ Twitter</span>
            </button>

            <button
              v-if="project.twitter_url && (twitter.status === 'changed' || twitter.status === 'error')"
              class="contrast"
              :disabled="busy === 'confirm'"
              @click="runCheck('confirm', () => api.confirmTwitter(project.id))"
            >
              <span v-if="busy === 'confirm'" class="spinner"></span>
              <span v-else>✓ Confirm</span>
            </button>

            <button
              v-if="project.website_url"
              class="secondary"
              :disabled="busy === 'website'"
              @click="runCheck('website', () => api.checkWebsite(project.id))"
            >
              <span v-if="busy === 'website'" class="spinner"></span>
              <span v-else>↻ Website</span>
            </button>

            <button
              v-if="project.website_url && (website.status === 'changed' || website.status === 'error')"
              class="contrast"
              :disabled="busy === 'confirm'"
              @click="runCheck('confirm', () => api.confirmWebsite(project.id))"
            >
              <span v-if="busy === 'confirm'" class="spinner"></span>
              <span v-else>✓ Confirm</span>
            </button>

            <button
              class="secondary"
              :disabled="busy === 'github'"
              @click="runCheck('github', () => api.checkGithub(project.id))"
            >
              <span v-if="busy === 'github'" class="spinner"></span>
              <span v-else>↻ GitHub</span>
            </button>
          </section>

        </article>
      `,

      setup(props, { emit }) {
        // busy tracks which check is currently running (used to show spinner + disable button)
        const busy = ref(null);

        // project.*_status objects come from the dashboard API (latest check result per resource)
        const website = computed(() => props.project.website_status || {});
        const github  = computed(() => props.project.github_status  || {});
        const twitter = computed(() => props.project.twitter_status || {});
        const websiteLastChanged = computed(() => props.project.website_last_changed_at || null);
        // Most recent latest_commit_date across all repos (instead of single project-level timestamp)
        const githubLastChanged = computed(() => {
          const repos = props.project.repos || [];
          const dates = repos.map(r => r.latest_commit_date).filter(Boolean);
          return dates.length ? dates.reduce((a, b) => a > b ? a : b) : null;
        });
        const twitterLastChanged = computed(() => props.project.twitter_last_changed_at || null);

        /**
         * Run a named check and emit 'refreshed' on success so the parent reloads data.
         * @param {string}   kind  - human-readable name for error messages
         * @param {Function} fn    - async function that calls one api.* method
         */
        async function runCheck(kind, fn) {
          busy.value = kind;
          try {
            await fn();
            emit('refreshed');
          } catch (e) {
            alert(`${kind} failed: ${e.message}`);
          } finally {
            busy.value = null;
          }
        }

        return {
          busy, website, github, twitter,
          websiteLastChanged, githubLastChanged, twitterLastChanged,
          runCheck,
          relativeTime,
          statusClass,
          // Expose api so the template's @click handlers can call api.checkWebsite(), etc.
          api: window.api,
        };
      },
    };

    /* ── Activity page ─────────────────────────────────────────────────────────
       Shows all projects (via dashboard API) and an optional recent log table.
       The dashboard endpoint returns projects with their latest status baked in.
    ───────────────────────────────────────────────────────────────────────── */
    const ActivityPage = {
      components: { ProjectCard, CheckLogList },

      template: `
        <div class="page">

          <div class="toolbar">
            <h1>Activity</h1>
            <button class="secondary" @click="showLogs = !showLogs">
              {{ showLogs ? 'Hide logs' : 'Show recent logs' }}
            </button>
            <button class="primary" :disabled="checkingAll || loading" @click="checkAll">
              <span v-if="checkingAll" class="spinner"></span>
              <span v-else>Check All</span>
            </button>
          </div>

          <div v-if="error" class="[role="alert"]">{{ error }}</div>

          <div v-if="loading" class="center-loader">
            <span class="spinner lg"></span>
          </div>

          <div v-else-if="!projects.length" class="empty">
            No projects yet. Add one in the <a href="#/projects">Projects</a> tab.
          </div>

          <div v-else class="grid cols-2">
            <ProjectCard
              v-for="p in projects"
              :key="p.id"
              :project="p"
              @refreshed="load"
            />
          </div>

          <!-- Optional recent check logs table -->
          <section v-if="showLogs && logs.length" class="logs-section">
            <h2>Recent check logs</h2>
            <article>
              <CheckLogList :logs="logs" :show-project="true" />
            </article>
          </section>

        </div>
      `,

      setup() {
        const projects   = ref([]);
        const logs      = ref([]);
        const loading   = ref(true);
        const checkingAll = ref(false);
        const error     = ref('');
        const showLogs  = ref(true);

        /** Load dashboard (projects + status) */
        async function load() {
          loading.value = true;
          error.value   = '';
          try {
            projects.value = await api.getDashboard();
          } catch (e) {
            error.value = e.message;
          } finally {
            loading.value = false;
          }
        }

        /** Load 30 most recent log entries */
        async function loadLogs() {
          try {
            const r = await api.getCheckLogs({ limit: 30 });
            // API may return items[], logs[], or the array directly
            logs.value = r.items || r.logs || r || [];
          } catch (e) {
            console.error(e);
          }
        }

        /** Trigger all checks across all projects */
        async function checkAll() {
          if (!confirm('Run checks for all projects now?')) return;
          checkingAll.value = true;
          try {
            await api.triggerAll();
            await load();
          } catch (e) {
            error.value = e.message;
          } finally {
            checkingAll.value = false;
          }
        }

        let pollTimer = null;

        onMounted(async () => {
          load();
          loadLogs();
          try {
            const cfg = await api.getSettings();
            if (cfg.ui_refresh_seconds) {
              pollTimer = setInterval(() => { load(); loadLogs(); }, cfg.ui_refresh_seconds * 1000);
            }
          } catch { /* auto-refresh disabled */ }
        });

        onUnmounted(() => { if (pollTimer) clearInterval(pollTimer); });

        return { projects, logs, loading, checkingAll, error, showLogs, checkAll, api: window.api };
      },
    };

    /* ── Projects page ─────────────────────────────────────────────────────────
       Table list of all projects with Create / Edit / Delete / JSON Import.
    ───────────────────────────────────────────────────────────────────────── */
    const ProjectsPage = {
      components: { ProjectForm },

      template: `
        <div class="page">

          <div class="toolbar">
            <h1>Projects</h1>
            <button @click="importOpen = true">Import JSON</button>
            <button class="primary" @click="openCreate">+ Add Project</button>
          </div>

          <div v-if="error" class="[role="alert"]">{{ error }}</div>

          <div v-if="loading" class="center-loader">
            <span class="spinner lg"></span>
          </div>

          <div v-else-if="!projects.length" class="empty">
            No projects yet. Click <strong>+ Add Project</strong> to start.
          </div>

          <div v-else>
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Website</th>
                  <th>GitHub</th>
                  <th>Twitter</th>
                  <th>Telegram</th>
                  <th class="col-actions"></th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="p in projects" :key="p.id">
                  <td>{{ p.name }}</td>
                  <td><a v-if="p.website_url" :href="p.website_url" target="_blank" rel="noopener">{{ urlLabel(p.website_url) }}</a><span v-else>—</span></td>
                  <td><a v-if="p.github_url" :href="p.github_url" target="_blank" rel="noopener">{{ urlLabel(p.github_url) }}</a><span v-else>—</span></td>
                  <td><a v-if="p.twitter_url" :href="p.twitter_url" target="_blank" rel="noopener">{{ urlLabel(p.twitter_url) }}</a><span v-else>—</span></td>
                  <td><a v-if="p.telegram_url" :href="p.telegram_url" target="_blank" rel="noopener">{{ urlLabel(p.telegram_url) }}</a><span v-else>—</span></td>
                  <td class="col-actions">
                    <button class="secondary" title="Edit"   @click="openEdit(p)">✎</button>
                    <button class="secondary" title="Delete" @click="onDelete(p)">🗑</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Create / Edit modal -->
          <div v-if="showForm" class="modal-backdrop" @click.self="showForm = false">
            <ProjectForm
              :initial="editing"
              :busy="submitting"
              @submit="onSubmit"
              @cancel="showForm = false"
            />
          </div>

          <!-- JSON import modal -->
          <div v-if="importOpen" class="modal-backdrop" @click.self="importOpen = false">
            <div class="modal">
              <h2>Import Projects from JSON</h2>
              <p class="muted">
                Paste JSON (object or array). Each item needs <code>name</code>;
                other fields optional.
              </p>

              <!-- File picker -->
              <div class="form-group">
                <input type="file" accept="application/json,.json" @change="onFile" />
              </div>

              <!-- Raw textarea -->
              <div class="form-group">
                <textarea
                  v-model="importText"
                  rows="10"
                  placeholder='[{"name":"Example","website_url":"https://example.com","github_url":"https://github.com/example"}]'
                ></textarea>
              </div>

              <div class="modal-actions">
                <button @click="importOpen = false">Cancel</button>
                <button
                  class="primary"
                  :disabled="importing || !importText.trim()"
                  @click="onImport"
                >
                  <span v-if="importing" class="spinner"></span>
                  <span v-else>Import</span>
                </button>
              </div>
            </div>
          </div>

        </div>
      `,

      setup() {
        const projects   = ref([]);
        const loading   = ref(true);
        const error     = ref('');
        const showForm  = ref(false);  // create/edit modal visibility
        const editing   = ref(null);    // project being edited (null = create)
        const submitting = ref(false);
        const importOpen  = ref(false); // JSON import modal visibility
        const importText  = ref('');    // raw JSON string in the import textarea
        const importing   = ref(false);

        /** Fetch all projects from the API */
        async function load() {
          loading.value = true;
          error.value   = '';
          try {
            projects.value = await api.listProjects();
          } catch (e) {
            error.value = e.message;
          } finally {
            loading.value = false;
          }
        }

        function openCreate() { editing.value = null; showForm.value = true; }
        function openEdit(p)   { editing.value = p;    showForm.value = true; }

        /** Create or update a project, then reload the list */
        async function onSubmit(payload) {
          submitting.value = true;
          error.value      = '';
          try {
            if (editing.value) {
              await api.updateProject(editing.value.id, payload);
            } else {
              await api.createProject(payload);
            }
            showForm.value  = false;
            editing.value    = null;
            await load();
          } catch (e) {
            error.value = e.message;
          } finally {
            submitting.value = false;
          }
        }

        /** Delete a project after user confirmation */
        async function onDelete(p) {
          const msg = `Delete "${p.name}"? This removes its repos and check logs.`;
          if (!confirm(msg)) return;
          try {
            await api.deleteProject(p.id);
            await load();
          } catch (e) {
            error.value = e.message;
          }
        }

        /**
         * Import one or more projects from the JSON textarea.
         * Accepts a single object or an array of objects.
         * Field mapping (API → import format):
         *   name → name,  url → website_url,
         *   github → github_url,  twitter → twitter_url,  telegram → telegram_url
         */
        async function onImport() {
          let parsed;
          try {
            parsed = JSON.parse(importText.value);
          } catch (e) {
            error.value = 'Invalid JSON: ' + e.message;
            return;
          }
          const list = Array.isArray(parsed) ? parsed : [parsed];

          importing.value = true;
          error.value     = '';
          let ok = 0, failed = 0;

          for (const item of list) {
            try {
              await api.createProject({
                name:         item.name,
                website_url:   item.url,
                github_url:    item.github,
                twitter_url:   item.twitter,
                telegram_url:  item.telegram,
              });
              ok++;
            } catch (e) {
              failed++;
            }
          }

          importing.value   = false;
          importOpen.value   = false;
          importText.value    = '';
          if (failed) error.value = `Imported ${ok}, ${failed} failed.`;
          await load();
        }

        /** Read a File into the textarea via FileReader */
        function onFile(e) {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => { importText.value = String(reader.result || ''); };
          reader.readAsText(file);
        }

        onMounted(load);

        return {
          projects, loading, error, showForm, editing, submitting,
          importOpen, importText, importing,
          openCreate, openEdit, onSubmit, onDelete, onImport, onFile,
          urlLabel,
          api: window.api,
        };
      },
    };

    /* ── Settings page ─────────────────────────────────────────────────────────
       Check interval configuration and manual trigger buttons.
       - Loads current config from GET /api/settings
       - Saves updates via PUT /api/settings
       - Trigger buttons call POST /api/settings/trigger-all
       - Clear Data empties projects/repos/logs tables but keeps config
    ───────────────────────────────────────────────────────────────────────── */
    const SettingsPage = {
      template: `
        <div class="page">
          <div class="toolbar"><h1>Settings</h1></div>

          <div v-if="error" class="[role="alert"]">{{ error }}</div>

          <div v-if="loading" class="center-loader">
            <span class="spinner lg"></span>
          </div>

          <div v-else class="grid">

            <!-- Check interval configuration -->
            <article>
              <h2>Check Intervals</h2>
              <p class="muted">How often each check runs automatically (in minutes). 60 min = 1 hour, 1440 min = 1 day.</p>

              <div class="form-group">
                <label>Commit / GitHub (minutes)</label>
                <input v-model.number="form.commit_interval_minutes" type="number" min="1" max="10080" />
              </div>

              <div class="form-group">
                <label>Website (minutes)</label>
                <input v-model.number="form.website_interval_minutes" type="number" min="1" max="10080" />
              </div>

              <div class="form-group">
                <label>Twitter (minutes)</label>
                <input v-model.number="form.twitter_interval_minutes" type="number" min="1" max="10080" />
              </div>

              <div class="actions">
                <button class="primary" :disabled="saving" @click="onSave">
                  <span v-if="saving" class="spinner"></span>
                  <span v-else>Save</span>
                </button>
              </div>
            </article>

            <!-- App Settings -->
            <article>
              <h2>App Settings</h2>

              <fieldset role="group">
                <label>
                  <input type="checkbox" v-model="form.log_retention_enabled" />
                  Delete logs older than 
                  <input v-show="form.log_retention_enabled" v-model.number="form.log_retention_days" type="number" min="0" max="365" style="width:80px"/> days
                </label>
              </fieldset>

              <fieldset role="group">
                <label>
                  <input type="checkbox" v-model="form.ui_refresh_enabled" />
                  Enable auto-refresh
                </label>
                <select v-show="form.ui_refresh_enabled" v-model.number="form.ui_refresh_seconds" style="width:120px">
                  <option value="30">30 sec</option>
                  <option value="60">60 sec</option>
                  <option value="90">90 sec</option>
                  <option value="120">120 sec</option>
                </select>
              </fieldset>

              <fieldset role="group">
                <label>
                  <input type="checkbox" v-model="form.showDangerZone" />
                  Show DB options
                </label>
              </fieldset>

              <button :disabled="saving" @click="saveAppSettings">
                <span v-if="!saving">Save</span>
                <span v-else class="spinner"></span>
              </button>
            </article>

            <!-- Manual triggers -->
            <article>
              <h2>Manual Triggers</h2>
              <p class="muted">Run checks for each resource type across all projects.</p>

              <div class="trigger-row">
                <div class="trigger-meta">
                  <h3>Websites</h3>
                </div>
                <button :disabled="triggering === 'web'" @click="onTrigger('web', api.triggerWebsites)">
                  <span v-if="triggering === 'web'" class="spinner"></span>
                  <span v-else>Run All</span>
                </button>
              </div>

              <div class="trigger-row">
                <div class="trigger-meta">
                  <h3>GitHub Repos</h3>
                </div>
                <button :disabled="triggering === 'gh'" @click="onTrigger('gh', api.triggerGithub)">
                  <span v-if="triggering === 'gh'" class="spinner"></span>
                  <span v-else>Run All</span>
                </button>
              </div>

              <div class="trigger-row">
                <div class="trigger-meta">
                  <h3>Twitter</h3>
                </div>
                <button :disabled="triggering === 'tw'" @click="onTrigger('tw', api.triggerTwitter)">
                  <span v-if="triggering === 'tw'" class="spinner"></span>
                  <span v-else>Run All</span>
                </button>
              </div>

            </article>

            <!-- Danger zone: wipe all data (keeps config) -->
            <article v-if="form.showDangerZone" class="danger-zone">
              <h2>Danger Zone</h2>
              <p class="muted">
                Delete all check logs, or delete everything including projects and repos. Settings are always kept.
              </p>
              <div class="danger-row">
                <button class="danger" :disabled="clearingLogs" @click="onClearLogs">
                  <span v-if="clearingLogs" class="spinner"></span>
                  <span v-else>Clear Logs</span>
                </button>
                <button class="danger" :disabled="clearing" @click="onClear">
                  <span v-if="clearing" class="spinner"></span>
                  <span v-else>Clear All Data</span>
                </button>
              </div>
            </article>

          </div>
        </div>
      `,

      setup() {
        const settings    = ref(null);
        const form        = ref({
          commit_interval_minutes:   360,
          website_interval_minutes:  1440,
          twitter_interval_minutes:  1440,
          log_retention_days:        7,
          log_retention_enabled:     false,
          ui_refresh_seconds:        60,
          ui_refresh_enabled:        false,
          showDangerZone:           false,
        });
        const loading   = ref(true);
        const saving    = ref(false);
        const triggering = ref(null);  // which trigger is running: 'web' | 'gh' | 'tw'
        const clearing  = ref(false);
        const clearingLogs = ref(false);
        const error      = ref('');

        /**
         * Extract the interval (in minutes) for a given check type from the settings object.
         * Tries several possible response shapes for backwards compatibility.
         */
        function pickMinutes(s, kind) {
          if (!s) return 360;
          // Flat shape: { commit_check_minutes: 360, website_check_minutes: 1440, ... }
          const d = s[kind + '_check_minutes'];
          if (d != null) return d;
          // Array shape: { configs: [{ resource_type: 'commit', interval_minutes: 360 }, ...] }
          const row = s.configs && s.configs.find &&
            s.configs.find(c => c.resource_type === kind || c.type === kind);
          return (row && row.interval_minutes) || 360;
        }

        /** Load settings from GET /api/settings */
        async function load() {
          loading.value = true;
          error.value   = '';
          try {
            settings.value = await api.getSettings();
            form.value = {
              commit_interval_minutes:  pickMinutes(settings.value, 'commit'),
              website_interval_minutes: pickMinutes(settings.value, 'website'),
              twitter_interval_minutes: pickMinutes(settings.value, 'twitter'),
              log_retention_days:   settings.value.log_retention_days || 7,
              log_retention_enabled: !!settings.value.log_retention_days,
              ui_refresh_seconds:    settings.value.ui_refresh_seconds || 60,
              ui_refresh_enabled:    !!settings.value.ui_refresh_seconds,
            };
          } catch (e) {
            error.value = e.message;
          } finally {
            loading.value = false;
          }
        }

        /** Save updated intervals via PUT /api/settings */
        async function onSave() {
          saving.value = true;
          error.value = '';
          try {
            settings.value = await api.updateSettings({
              commit_check_minutes:  Number(form.value.commit_interval_minutes),
              website_check_minutes: Number(form.value.website_interval_minutes),
              twitter_check_minutes: Number(form.value.twitter_interval_minutes),
              log_retention_days:    Number(form.value.log_retention_days),
            });
            showToast('Saved.');
          } catch (e) {
            error.value = e.message;
          } finally {
            saving.value = false;
          }
        }

        /** Save App Settings (log retention only) */
        async function saveAppSettings() {
          saving.value = true;
          error.value = '';
          try {
            settings.value = await api.updateSettings({
              log_retention_days: form.value.log_retention_enabled
                ? Number(form.value.log_retention_days) || 7
                : 0,
              ui_refresh_seconds: form.value.ui_refresh_enabled
                ? Number(form.value.ui_refresh_seconds) || 60
                : 0,
            });
            showToast('Saved.');
          } catch (e) {
            error.value = e.message;
          } finally {
            saving.value = false;
          }
        }

        /** Run trigger-all for a specific kind (web / gh / tw) */
        async function onTrigger(kind, fn) {
          triggering.value = kind;
          try {
            await fn();
          } catch (e) {
            error.value = e.message;
          } finally {
            triggering.value = null;
          }
        }

        /** Clear check logs only, keep projects and repos */
        async function onClearLogs() {
          if (!confirm('Delete all check logs?')) return;
          clearingLogs.value = true;
          try {
            await api.clearLogs();
          } catch (e) {
            error.value = e.message;
          } finally {
            clearingLogs.value = false;
          }
        }

        /** Delete all projects/repos/logs but keep the config row */
        async function onClear() {
          const msg = 'Delete all projects, repos and check logs? Config will be kept.';
          if (!confirm(msg)) return;
          clearing.value = true;
          try {
            await api.clearData();
            window.location.reload();
          } catch (e) {
            error.value = e.message;
            clearing.value = false;
          }
        }

        // Derived refs: last run timestamp for each check type (from settings.configs)
        // The dashboard API returns this on the config rows when available.
        const lastCommit = computed(() => {
          const r = settings.value?.configs?.find?.(
            c => c.resource_type === 'commit' || c.type === 'commit'
          );
          return r?.last_checked_at || r?.last_run_at || null;
        });
        const lastWebsite = computed(() => {
          const r = settings.value?.configs?.find?.(
            c => c.resource_type === 'website'
          );
          return r?.last_checked_at || null;
        });
        const lastTwitter = computed(() => {
          const r = settings.value?.configs?.find?.(
            c => c.resource_type === 'twitter'
          );
          return r?.last_checked_at || null;
        });

        onMounted(load);

        return {
          settings, form, loading, saving, triggering, clearing, clearingLogs,
          error,
          onSave, saveAppSettings, onTrigger, onClear, onClearLogs,
          lastCommit, lastWebsite, lastTwitter,
          relativeTime,
          api: window.api,
        };
      },
    };

    /* ── Router ─────────────────────────────────────────────────────────────────
       Simple hash-based SPA router.
       Hash format: '' or '/' → ActivityPage, '/projects' → ProjectsPage,
       '/settings' → SettingsPage.
       Uses Vue's <component :is="..." /> to swap views.
    ───────────────────────────────────────────────────────────────────────── */
    const routes = {
      '/':          ActivityPage,
      '/projects':  ProjectsPage,
      '/settings':  SettingsPage,
    };

    function hashRouter() {
      return {
        render() {
          return routes[window.location.hash.slice(1) || '/'] || routes['/'];
        },
      };
    }

    /* ── Root App component ────────────────────────────────────────────────────
       Composes NavBar + the current page view, with a fade transition between views.
    ───────────────────────────────────────────────────────────────────────── */
    const App = {
      components: { NavBar },

      template: `
        <div>
          <NavBar />
          <transition name="fade" mode="out-in">
            <component :is="currentView" />
          </transition>
        </div>
      `,

      data() {
        return { currentView: hashRouter().render() };
      },

      mounted() {
        // Re-render whenever the hash changes (i.e., user clicked a nav tab)
        window.addEventListener('hashchange', () => {
          this.currentView = hashRouter().render();
        });
      },
    };

    /* ── Bootstrap ───────────────────────────────────────────────────────────── */
    const app = createApp(App);
    app.mount('#app');
  </script>
</body>
</html>
