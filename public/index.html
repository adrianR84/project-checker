<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark">
  <title>Project Checker</title>

  <!-- Inline SVG favicon: blue circle with green center -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%236c8cff'/><circle cx='50' cy='50' r='25' fill='%2334d399'/></svg>" />

  <!-- Pico.css — custom styles.css overrides it where needed -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  
  <!-- External CSS (separate file for caching and readability) -->
  <link rel="stylesheet" href="/styles.css" />

</head>

<body>
  <div id="app"></div>
  <div id="toast" aria-live="polite"></div>

  <!-- Vue 3 CDN (production build, no dev warnings) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <script>
    /* ─────────────────────────────────────────────────────────────────────────
       Vue 3 CDN — API is defined at module scope and exposed on window so
       templates can call api.* directly via the returned `api: window.api`.
    ───────────────────────────────────────────────────────────────────────── */

    // Pull only what we need from the global Vue object
    const { createApp, ref, computed, onMounted, onUnmounted, watch, nextTick, Transition } = Vue;

    /* ── API layer ───────────────────────────────────────────────────────────────
       Thin wrapper around fetch(). All calls go to /api/* on the same host.
       live-server proxies /api → Express on port 3000 during development.
    ───────────────────────────────────────────────────────────────────────── */
    const BASE = '/api';

    /**
     * Make an HTTP request to the Express API.
     * @param {string} path  - e.g. '/projects' or '/projects/5'
     * @param {object} opts  - fetch options: { method, headers, body, ... }
     */
    async function req(path, opts = {}) {
      const r = await fetch(BASE + path, {
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        ...opts,
      });
      if (!r.ok) {
        // Try to extract { error: "..." } from the JSON body
        let d = '';
        try { d = (await r.json()).error || r.statusText; } catch { d = r.statusText; }
        throw new Error(d);
      }
      return r.json();
    }

    /** All API methods — one per backend endpoint */
    const api = {
      getDashboard:   ()       => req('/dashboard'),
      listProjects:   ()       => req('/projects'),
      getProject:     (id)     => req(`/projects/${id}`),
      createProject:  (d)      => req('/projects',            { method: 'POST',   body: JSON.stringify(d) }),
      updateProject:  (id, d)  => req(`/projects/${id}`,     { method: 'PUT',    body: JSON.stringify(d) }),
      deleteProject:  (id)     => req(`/projects/${id}`,     { method: 'DELETE' }),
      refreshRepos:   (id)     => req(`/projects/${id}/refresh-repos`, { method: 'POST' }),
      getOrgRepos:    (id)     => req(`/projects/${id}/org-repos`),
      addRepos:       (id, repos) => req(`/projects/${id}/add-repos`,   { method: 'POST', body: JSON.stringify({ repos }) }),
      removeRepo:     (id, fullName) => req(`/projects/${id}/repos/${encodeURIComponent(fullName)}`, { method: 'DELETE' }),
      checkWebsite:   (id)     => req(`/projects/${id}/check-website`,  { method: 'POST' }),
      checkGithub:    (id)     => req(`/projects/${id}/check-github`,   { method: 'POST' }),
      checkTwitter:   (id)     => req(`/projects/${id}/check-twitter`,  { method: 'POST' }),
      getCheckLogs:       (q = {}) => req('/check-logs?' + new URLSearchParams(q).toString()),
      getStatusChanges:   (q = {}) => req('/check-logs/status-changes?' + new URLSearchParams(q).toString()),
      confirmStatusChange: (id, confirmed = 1) => req(`/check-logs/status-changes/${id}/confirm`, { method: 'PATCH', body: JSON.stringify({ confirmed: confirmed ? 1 : 0 }) }),
      getAlertLogs:       (q = {}) => req('/check-logs/alerts?' + new URLSearchParams(q).toString()),
      getTokenPrices:     ()       => req('/dashboard/token-prices'),
      getSettings:    ()       => req('/settings'),
      updateSettings: (d)      => req('/settings',           { method: 'PUT',    body: JSON.stringify(d) }),
      triggerAll:     ()       => req('/settings/trigger-all',   { method: 'POST' }),
      triggerWebsites: ()     => req('/settings/trigger-websites', { method: 'POST' }),
      triggerGithub:   ()     => req('/settings/trigger-github',  { method: 'POST' }),
      triggerTwitter:  ()     => req('/settings/trigger-twitter',  { method: 'POST' }),
      clearData:      ()       => req('/settings/clear-data',   { method: 'POST' }),
      clearLogs:      ()       => req('/settings/clear-logs',   { method: 'POST' }),
      clearAlertLogs: ()       => req('/settings/clear-alert-logs', { method: 'POST' }),
    };

    // Expose globally so the template can call api.* after we return api: window.api
    window.api = api;

    // Shared settings ref accessible across all components
    const appSettings = ref(null);
    window.appSettings = appSettings;

    // Fear & Greed Index — fetched once at startup, displayed in navbar
    const fearIndex = ref(null);
    window.fearIndex = fearIndex;

    /** Show a toast notification in the bottom-right corner */
    function showToast(msg, type = 'ok') {
      const el = document.createElement('div');
      el.className = `toast-msg ${type}`;
      el.textContent = msg;
      document.getElementById('toast').appendChild(el);
      setTimeout(() => el.remove(), 2200);
    }
    window.showToast = showToast;

    /* ── Shared helpers ─────────────────────────────────────────────────────────
       Used directly in templates via Vue's template expression evaluation.
    ───────────────────────────────────────────────────────────────────────── */

    /** Format a timestamp as a human-readable relative string: "3 hours ago" */
    const RTF = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
    const DTF = new Intl.DateTimeFormat('en', { dateStyle: 'medium', timeStyle: 'short' });
    const UNITS = [
      ['year',   31536e3],
      ['month',  2592e3],
      ['week',   604800],
      ['day',    86400],
      ['hour',   3600],
      ['minute', 60],
      ['second', 1],
    ];

    function relativeTime(v) {
      if (!v) return 'never';
      let ms;
      if (typeof v === 'number') {
        ms = v > 1e12 ? v : v * 1000;
      } else if (typeof v === 'string') {
        const parsed = parseFloat(v);
        if (!isNaN(parsed) && parsed > 1e12) {
          // Already milliseconds (e.g. "1781640210000.0")
          ms = parsed;
        } else if (!isNaN(parsed) && parsed > 1e9) {
          // Unix seconds
          ms = parsed * 1000;
        } else {
          // ISO string
          ms = new Date(v).getTime();
        }
      } else {
        ms = new Date(v).getTime();
      }
      if (isNaN(ms)) return 'never';
      const d = new Date(ms);
      if (isNaN(d)) return 'never';
      const diff = (d.getTime() - Date.now()) / 1000;
      for (const [u, s] of UNITS)
        if (Math.abs(diff) >= s || u === 'second') return RTF.format(Math.round(diff / s), u);
      return 'just now';
    }

    /** Format a timestamp as an absolute date+time string: "Jun 30, 2026, 5:00 PM" */
    function absoluteTime(v) {
      if (!v) return '—';
      const d = new Date(v);
      if (isNaN(d)) return '—';
      return DTF.format(d);
    }

    /** Format a number as short dollar value: 1000 → $1K, 1000000 → $1M, 1000000000 → $1B */
    function fmtShortNum(v) {
      if (v == null || isNaN(v)) return '—';
      if (Math.abs(v) >= 1e9) return '$' + (v / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
      if (Math.abs(v) >= 1e6) return '$' + (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
      if (Math.abs(v) >= 1e3) return '$' + (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
      return '$' + v.toFixed(2);
    }

    /** Format a price-change value as percentage string */
    function fmtPct(v) {
      if (v == null || isNaN(v)) return '—';
      return (v >= 0 ? '+' : '') + parseFloat(v).toFixed(2) + '%';
    }

    /** Extract the hostname from a URL, stripping leading "www." */
    /**
     * Extract a human-readable label from a URL, tailored to each platform.
     * - Website → hostname only (e.g. "autonaisol.xyz")
     * - GitHub  → org/user path (e.g. "auton-ai")
     * - Twitter / X → handle (e.g. "auton_ai")
     * - Telegram → channel/handle (e.g. "auton_ai")
     */
    function urlLabel(u) {
      if (!u) return null;
      try {
        const url = new URL(u);
        const h = url.hostname.replace(/^www\./, '');
        if (h === 'github.com' || h === 'www.github.com') return url.pathname.replace(/^\//, '').split('/')[0] || null;
        if (h === 'x.com' || h === 'www.x.com' || h === 'twitter.com' || h === 'www.twitter.com') return url.pathname.replace(/^\//, '') || null;
        if (h === 't.me' || h === 'www.t.me') return url.pathname.replace(/^\//, '') || null;
        return h; // websites: just the hostname
      } catch { return u; }
    }

    /** Format a check_logs row for the detail column */
    function logDetail(log) {
      const { status, http_status, response_time_ms, error_message, details, resource_type, repo_name } = log || {};
      const repo = (resource_type === 'github' && repo_name) ? repo_name + ' · ' : '';
      if (status === 'ok') return repo + (http_status ? `HTTP ${http_status}${response_time_ms ? ' · ' + response_time_ms + 'ms' : ''}` : (response_time_ms ? response_time_ms + 'ms' : 'OK'));
      if (status === 'error') return repo + (error_message || 'Unknown error');
      if (status === 'disabled') return repo + 'Check disabled';
      if (status === 'unavailable') return repo + 'Resource not configured';
      if (status === 'deleted') return repo + 'Resource deleted';
      if (status === 'changed' && details) {
        try {
          const p = typeof details === 'string' ? JSON.parse(details) : details;
          if (resource_type === 'github' && p.sha) return repo + 'New Commit ' + p.sha.slice(0, 7);
          if (p.content_hash) return repo + 'Content Changed';
        } catch (_) {}
      }
      return repo || '—';
    }

    /** Return the URL for a log entry's resource (website, twitter, or github repo) */
    function resourceUrl(log) {
      if (log.resource_type === 'website' && log.website_url) return log.website_url;
      if (log.resource_type === 'twitter' && log.twitter_url) return log.twitter_url;
      if (log.resource_type === 'github' && log.repo_name) return 'https://github.com/' + log.repo_name;
      return null;
    }

    /** Map a raw status string → CSS class name for the badge */
    function statusClass(s) {
      if (s === 'ok' || s === 'success') return 'ok';
      if (s === 'error' || s === 'failed') return 'error';
      if (s === 'changed') return 'changed';
      return 'pending';
    }

    /* ── NavBar component ──────────────────────────────────────────────────────
       Sticky top bar with a brand mark and navigation tabs.
       currentRoute is a ref that updates whenever the hash changes,
       causing Vue to re-evaluate the :class binding on each tab.
    ───────────────────────────────────────────────────────────────────────── */
    const NavBar = {
      template: `
        <nav class="navbar">
          <ul>
            <li>
              <a href="#/" class="brand">
                <span class="logo-dot"></span>
                Project Checker
              </a>
            </li>
            <li v-if="fearIndex?.value !== undefined">
              <a href="https://alternative.me/crypto/fear-and-greed-index/" target="_blank" rel="noopener" style="font-size:0.8rem" :class="['badge', fearIndex.value_classification === 'Extreme Fear' ? 'error' : fearIndex.value_classification === 'Fear' ? 'pending' : fearIndex.value_classification.includes('Greed') ? 'ok' : 'pending']" :title="'Fear & Greed Index: ' + fearIndex.value_classification">
                {{ fearIndex.value }} {{ fearIndex.value_classification }}
              </a>
            </li>
          </ul>
          <ul>
            <li v-for="t in leftTabs" :key="t.to">
              <a
                :href="'#' + t.to"
                :aria-current="currentRoute === t.to ? 'page' : undefined"
              >{{ t.label }}</a>
            </li>
          </ul>
          <ul>
            <li v-for="t in rightTabs" :key="t.to">
              <a
                :href="'#' + t.to"
                :aria-current="currentRoute === t.to ? 'page' : undefined"
              >{{ t.label }}</a>
            </li>
          </ul>
        </nav>
      `,

      setup() {
        // Read initial hash route, e.g. '' → '/', '/projects' → '/projects'
        const currentRoute = ref(window.location.hash.slice(1) || '/');

        // Re-read hash whenever the URL fragment changes (SPA navigation)
        window.addEventListener('hashchange', () => {
          currentRoute.value = window.location.hash.slice(1) || '/';
        });

        // Fetch Fear & Greed Index once at startup
        if (!window.fearIndex.value) {
          fetch('https://api.alternative.me/fng/')
            .then(r => r.json())
            .then(j => { if (j.data?.[0]) window.fearIndex.value = j.data[0]; })
            .catch(() => {});
        }

        return {
          leftTabs: [
            { to: '/',         label: 'Activity'  },
            { to: '/projects', label: 'Projects'  },
          ],
          rightTabs: [
            { to: '/settings', label: 'Settings'  },
          ],
          currentRoute,
          fearIndex: window.fearIndex,
        };
      },
    };

    /* ── RepoList component ────────────────────────────────────────────────────
       Renders a list of GitHub repositories attached to a project.
       Props: repos (array from project.repos)
    ───────────────────────────────────────────────────────────────────────── */
    const RepoList = {
      props: ['repos'],

      template: `
        <div>
          <div v-if="!repos.length" class="muted">No repositories linked.</div>

          <ul v-else class="repo-list">
            <li v-for="r in repos" :key="r.id || r.full_name" class="repo">
              <!-- Repo name / link (use repo_url if set, otherwise build from full_name) -->
              <div class="repo-name">
                <a :href="r.repo_url || 'https://github.com/' + r.full_name" target="_blank" rel="noopener">
                  {{ r.full_name }}
                </a>
              </div>

              <!-- Latest commit info row -->
              <div class="repo-meta">
                <span v-if="r.latest_tag" class="badge badge-ok" style="font-size:0.6rem;">{{ r.latest_tag }}</span>
                <template v-if="r.latest_commit_sha">
                  <!-- Short SHA link to commit on GitHub -->
                  <a
                    :href="(r.repo_url || 'https://github.com/' + r.full_name) + '/commit/' + r.latest_commit_sha"
                    target="_blank" rel="noopener" class="sha"
                  >{{ r.latest_commit_sha.slice(0, 7) }}</a>

                  <span v-if="r.latest_commit_message" class="msg">
                    {{ r.latest_commit_message }}
                  </span>

                  <span v-if="r.latest_commit_date" class="muted">
                    · {{ relativeTime(r.latest_commit_date) }}
                  </span>
                </template>
                <span v-else class="muted">no commits yet</span>
              </div>
            </li>
          </ul>
        </div>
      `,

      // Expose helpers to the template
      methods: { relativeTime },
    };

    /* ── CheckLogList component ───────────────────────────────────────────────
       Renders a table of recent check log entries.
       Props: logs, showProject, page, total, limit
       Emits: change-page
    ───────────────────────────────────────────────────────────────────────── */
    const CheckLogList = {
      props: ['logs', 'showProject', 'page', 'total', 'limit'],
      emits: ['changePage'],

      template: `
        <div>
          <div v-if="!logs.length" class="muted">No check logs yet.</div>

          <table v-else class="compact">
            <thead>
              <tr>
                <th class="project_cell" data-tooltip="Project name">Project</th>
                <th class="resource_cell" data-tooltip="Resource type: website, GitHub, or Twitter">Type</th>
                <th class="status_cell" data-tooltip="Check result status">Status</th>
                <th class="time_cell" data-tooltip="Time of the check">When</th>
                <th class="details_cell" data-tooltip="Response details">Details</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="log in logs" :key="log.id">
                <td>{{ log.project_name || log.project_id }}</td>
                <td><a v-if="resourceUrl(log)" :href="resourceUrl(log)" target="_blank" rel="noopener">{{ log.resource_type }}</a><span v-else>{{ log.resource_type }}</span></td>
                <td>
                  <span :class="['badge', statusClass(log.status)]">{{ log.status }}</span>
                </td>
                <td class="muted">{{ absoluteTime(log.checked_at) }}</td>
                <td>{{ logDetail(log) }}</td>
              </tr>
            </tbody>
          </table>

          <div class="pagination" v-if="totalPages > 1">
            <button :disabled="page <= 1" @click="$emit('changePage', page - 1)">&larr;</button>
            <span>Page {{ page }} of {{ totalPages }}</span>
            <button :disabled="page >= totalPages" @click="$emit('changePage', page + 1)">&rarr;</button>
          </div>
        </div>
      `,

      computed: {
        totalPages() { return Math.ceil(this.total / this.limit) || 1; }
      },

      methods: { relativeTime, absoluteTime, statusClass, logDetail, resourceUrl },
    };

    /* ── Shared formatting helpers for StatusChangeList and AlertLogsList ─────── */
    const statusChangeHelpers = {
      badgeClass(eventType) {
        if (eventType === 'tag_changed') return 'pending';
        if (eventType === 'changed') return 'changed';
        if (eventType === 'deleted') return 'error';
        return 'pending';
      },
      formatChangeValue(eventType, resourceType, value) {
        if (!value) return '—';
        try {
          const v = JSON.parse(value);
          if (eventType === 'tag_changed') return `${v.repo_name} · ${v.ot ?? 'none'} → ${v.nt ?? 'none'}`;
          if (eventType === 'changed' && resourceType === 'github') return `${v.repo_name} · commit ${v.sha?.slice(0, 7) ?? '?'}`;
          if (eventType === 'changed' && resourceType === 'website') {
            const hs = (v.bhs || v.ahs) ? `${v.bhs ?? ''} → ${v.ahs ?? ''}` : '';
            const hv = (v.bh && v.ah) ? (v.bh !== v.ah ? 'content changed' : `${v.bh.slice(0, 8)}… → ${v.ah.slice(0, 8)}…`) : '';
            return [hs, hv].filter(Boolean).join(' · ');
          }
          if (eventType === 'changed' && resourceType === 'twitter') {
            const hs = (v.bhs || v.ahs) ? `${v.bhs ?? ''} → ${v.ahs ?? ''}` : '';
            const bs = v.bs && v.as ? (v.as === 'error' ? '<span style="color:#e55">removed</span>' : `${v.bs} → ${v.as}`) : '';
            return [hs, bs].filter(Boolean).join(' · ');
          }
          if (eventType === 'deleted' && resourceType === 'github') return `${v.repo_name} · <span style="color:#e55">deleted</span>`;
          return value;
        } catch (_) { return value; }
      },
      scResourceUrl(log) {
        if (log.resource_type === 'website' && log.website_url) return log.website_url;
        if (log.resource_type === 'twitter' && log.twitter_url) return log.twitter_url;
        if (log.resource_type === 'github' && log.value) {
          try {
            const v = JSON.parse(log.value);
            if (v.repo_name) return 'https://github.com/' + v.repo_name;
          } catch (_) {}
        }
        return null;
      },
      alertResourceUrl(log) {
        if (log.resource_type === 'website' && log.website_url) return log.website_url;
        if (log.resource_type === 'twitter' && log.twitter_url) return log.twitter_url;
        if (log.resource_type === 'github' && log.change_value) {
          try {
            const v = JSON.parse(log.change_value);
            if (v.repo_name) return 'https://github.com/' + v.repo_name;
          } catch (_) {}
        }
        return null;
      }
    };

    /* ── StatusChangeList component ────────────────────────────────────────────
       Renders event_logs entries.
       Props: logs, showProject, page, total, limit
       Emits: changePage, refresh
    ───────────────────────────────────────────────────────────────────────── */
    const StatusChangeList = {
      props: ['logs', 'showProject', 'page', 'total', 'limit'],
      emits: ['changePage', 'refresh'],

      template: `
        <div>
          <div v-if="!logs.length" class="muted">No status changes yet.</div>
          <table v-else class="compact">
            <thead>
              <tr>
                <th class="project_cell" data-tooltip="Project name">Project</th>
                <th class="resource_cell" data-tooltip="Resource type: website, GitHub, or Twitter">Type</th>
                <th class="type_cell" data-tooltip="Type of status change event">Event</th>
                <th class="time_cell" data-tooltip="Time of the event">When</th>
                <th class="details_cell" data-tooltip="Additional event details">Details</th>
                <th style="width:32px"></th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="log in logs" :key="log.id">
                <td>{{ log.project_name || log.project_id }}</td>
                <td><a v-if="scResourceUrl(log)" :href="scResourceUrl(log)" target="_blank" rel="noopener">{{ log.resource_type }}</a><span v-else>{{ log.resource_type }}</span></td>
                <td>
                  <span :class="['badge', badgeClass(log.event_type)]">
                    {{ log.event_type }}
                  </span>
                </td>
                <td class="muted">{{ absoluteTime(log.created_at) }}</td>
                <td v-html="formatChangeValue(log.event_type, log.resource_type, log.value)"></td>
                <td>
                  <input type="checkbox" :checked="!!log.confirmed" @change="toggleConfirm(log, $event)" />
                </td>
              </tr>
            </tbody>
          </table>

          <div class="pagination" v-if="totalPages > 1">
            <button :disabled="page <= 1" @click="$emit('changePage', page - 1)">&larr;</button>
            <span>Page {{ page }} of {{ totalPages }}</span>
            <button :disabled="page >= totalPages" @click="$emit('changePage', page + 1)">&rarr;</button>
          </div>
        </div>
      `,

      computed: {
        totalPages() { return Math.ceil(this.total / this.limit) || 1; },
      },

      methods: {
        relativeTime, absoluteTime,
        badgeClass: statusChangeHelpers.badgeClass,
        formatChangeValue: statusChangeHelpers.formatChangeValue,
        scResourceUrl: statusChangeHelpers.scResourceUrl,
        async toggleConfirm(log, event) {
          if (log.confirmed) {
            if (!confirm('Unconfirm this status change?')) {
              event.target.checked = true;
              return;
            }
          }
          try {
            await api.confirmStatusChange(log.id, log.confirmed ? 0 : 1);
            showToast(log.confirmed ? 'Unconfirmed' : 'Confirmed', 'ok');
            this.$emit('changePage', this.page);
          } catch (e) {
            event.target.checked = !!log.confirmed;
            alert('Failed: ' + e.message);
          }
        },
      },
    };

    /* ── AlertLogsList component ──────────────────────────────────────────────
       Renders alert_logs entries.
       Props: logs, page, total, limit
       Emits: change-page
    ───────────────────────────────────────────────────────────────────────── */
    const AlertLogsList = {
      props: ['logs', 'page', 'total', 'limit'],
      emits: ['changePage'],

      template: `
        <div>
          <div v-if="!logs.length" class="muted">No alert logs yet.</div>
          <table v-else class="compact">
            <thead>
              <tr>
                <th class="project_cell alert" data-tooltip="Project name">Project</th>
                <th class="type_cell" data-tooltip="Resource type">Resource</th>
                <th class="type_cell" data-tooltip="Event type">Event</th>
                <th class="time_cell" data-tooltip="Time the alert was recorded">When</th>
                <th class="details_cell" data-tooltip="Alert details">Details</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="log in logs" :key="log.id">
                <td>{{ log.project_name || log.status_change_id }}</td>
                <td><a v-if="alertResourceUrl(log)" :href="alertResourceUrl(log)" target="_blank" rel="noopener">{{ log.resource_type }}</a><span v-else>{{ log.resource_type }}</span></td>
                <td>
                  <span :class="['badge', badgeClass(log.event_type)]">
                    {{ log.event_type }}
                  </span>
                </td>
                <td class="muted">{{ absoluteTime(log.created_at) }}</td>
                <td v-html="formatChangeValue(log.event_type, log.resource_type, log.change_value)"></td>
              </tr>
            </tbody>
          </table>

          <div class="pagination" v-if="totalPages > 1">
            <button :disabled="page <= 1" @click="$emit('changePage', page - 1)">&larr;</button>
            <span>Page {{ page }} of {{ totalPages }}</span>
            <button :disabled="page >= totalPages" @click="$emit('changePage', page + 1)">&rarr;</button>
          </div>
        </div>
      `,

      computed: {
        totalPages() { return Math.ceil(this.total / this.limit) || 1; }
      },

      methods: {
        absoluteTime,
        badgeClass: statusChangeHelpers.badgeClass,
        formatChangeValue: statusChangeHelpers.formatChangeValue,
        alertResourceUrl: statusChangeHelpers.alertResourceUrl,
      },
    };

    /* ── ProjectForm component ─────────────────────────────────────────────────
       Modal form for creating or editing a project.
       Props:   initial (project object — null for create)
                busy    (bool — disable submit while saving)
       Emits:   submit  (validated project data)
                cancel  (user clicked Cancel)
    ───────────────────────────────────────────────────────────────────────── */
    const ProjectForm = {
      props: ['initial', 'busy'],
      emits: ['submit', 'cancel'],

      template: `
        <div class="modal">
          <h2 style="font-size: 1.2rem;">{{ initial ? 'Edit Project' : 'New Project' }}</h2>

          <!-- Tab switcher -->
          <div class="tabs">
            <button :class="['tab', formTab === 'fields' ? 'active' : '']" @click="formTab = 'fields'">Fields</button>
            <button :class="['tab', formTab === 'json' ? 'active' : '']" @click="formTab = 'json'">JSON</button>
          </div>

          <!-- Fields tab -->
          <div v-if="formTab === 'fields'">
            <div class="form-row">
              <div class="form-row-header">
                <label>Name *</label>
                <label data-tooltip="Master switch: disables all checks and alerts are off" data-placement="left"><input type="checkbox" v-model="f.project_enabled" /> Project enabled</label>
              </div>
              <input v-model="f.name" required placeholder="My Project" />
            </div>

            <div class="form-row">
              <div class="form-row-header">
                <label>Website URL</label>
                <label data-tooltip="Verify page content matches expected value" data-placement="top"><input type="checkbox" v-model="f.website_content_check" /> Content Check</label>
                <label data-tooltip="Perform HTTP checks on this website" data-placement="left"><input type="checkbox" v-model="f.website_enabled" /> Enabled</label>
              </div>
              <input v-model="f.website_url" type="url" placeholder="https://example.com" />
            </div>

            <div class="form-row">
              <div class="form-row-header">
                <label class="muted">GitHub URL (optional)</label>
                <label data-tooltip="Track repos and monitor commit activity" data-placement="left"><input type="checkbox" v-model="f.github_enabled" /> Enabled</label>
              </div>
              <input v-model="f.github_url" type="url" placeholder="https://github.com/org" />
            </div>

            <div class="form-row">
              <div class="form-row-header">
                <label>Twitter URL</label>
                <label data-tooltip="Check Twitter account existence and account suspension" data-placement="left"><input type="checkbox" v-model="f.twitter_enabled" /> Enabled</label>
              </div>
              <input v-model="f.twitter_url" type="url" placeholder="https://twitter.com/handle" />
            </div>

            <div class="form-row">
              <div class="form-row-header">
                <label class="muted">Telegram URL (optional)</label>
              </div>
              <input v-model="f.telegram_url" type="url" placeholder="https://t.me/channel" />
            </div>

            <div class="form-row">
              <div class="form-row-header">
                <label>Token</label>
                <span v-if="tokenLookupBusy" class="spinner" style="width:1rem;height:1rem;display:inline-block;"></span>
                <label data-tooltip="Track token price and send alerts" data-placement="left"><input type="checkbox" v-model="f.price_enabled" /> Enabled</label>
              </div>
              <div class="form-row-group">
                <input v-model="f.token_symbol" placeholder="Symbol (e.g. JTVO)" style="flex: 1;" />
                <input v-model="f.token_contract" placeholder="Contract" style="flex: 2;" @blur="lookupToken" />
                <input v-model="f.token_chain" placeholder="Chain (e.g. solana)" style="flex: 1;" />
              </div>
            </div>
          </div>

          <!-- JSON tab (edit mode only — create has no existing project to partial-update) -->
          <div v-if="formTab === 'json'" class="form-group">
            <label>Project JSON — only entered fields are updated</label>
            <textarea
              v-model="jsonEditText"
              rows="8"
              placeholder='{"name":"New Name","website":"https://new-site.com","symbol":"JTVO","contractAddress":"...","chainId":"solana"}'
            ></textarea>
            <span v-if="jsonEditError" class="error-msg">{{ jsonEditError }}</span>
          </div>

          <div class="modal-actions">
            <button type="button" @click="$emit('cancel')">Cancel</button>
            <button type="button" class="primary" :disabled="busy" @click="onSubmit()">
              <span v-if="busy" class="spinner"></span>
              <span v-else>{{ initial ? 'Save' : 'Create' }}</span>
            </button>
          </div>
        </div>
      `,

      setup(props, { emit }) {
        // Local form state — starts empty or pre-filled with initial values
        const f = ref({
          name: '', website_url: '', github_url: '', twitter_url: '', telegram_url: '',
          website_enabled: true, website_content_check: true, github_enabled: true, twitter_enabled: true, telegram_enabled: true,
          project_enabled: true, price_enabled: true, token_symbol: '', token_contract: '', token_chain: '',
        });
        const jsonEditText  = ref('');
        const jsonEditError = ref('');
        const formTab = ref('fields');
        const tokenLookupBusy = ref(false);

        // Sync form fields whenever the `initial` prop changes
        // (happens when switching from "create" to "edit" mode)
        watch(
          () => props.initial,
          (v) => {
            formTab.value = 'fields';
            if (v) {
              const tok = v.token ? (typeof v.token === 'string' ? JSON.parse(v.token) : v.token) : {};
              f.value = {
                name:         v.name         || '',
                website_url:   v.website_url   || '',
                github_url:   v.github_url    || '',
                twitter_url:  v.twitter_url   || '',
                telegram_url: v.telegram_url  || '',
                website_enabled:  !!v.website_enabled,
                website_content_check: !!v.website_content_check,
                github_enabled:   !!v.github_enabled,
                twitter_enabled:  !!v.twitter_enabled,
                telegram_enabled: !!v.telegram_enabled,
                project_enabled: !!v.enabled,
                price_enabled: !!v.price_enabled,
                token_symbol: tok.symbol || '',
                token_contract: tok.contract || '',
                token_chain: tok.chain || '',
              };
            } else {
              f.value = { name: '', website_url: '', github_url: '', twitter_url: '', telegram_url: '',
                website_enabled: true, website_content_check: true, github_enabled: true, twitter_enabled: true, telegram_enabled: true,
                project_enabled: true, price_enabled: true, token_symbol: '', token_contract: '', token_chain: '' };
            }
          },
          { immediate: true }
        );

        async function lookupToken() {
          const contract = f.value.token_contract?.trim();
          if (!contract || f.value.token_symbol?.trim() || f.value.token_chain?.trim()) return;
          tokenLookupBusy.value = true;
          try {
            const chain = f.value.token_chain?.trim() || 'solana';
            const r = await fetch(`https://api.dexscreener.com/token-pairs/v1/${chain}/${contract}`);
            const data = await r.json();
            const pair = Array.isArray(data) ? data.find(p => p.baseToken?.address === contract) : null;
            if (pair?.baseToken) {
              if (!f.value.token_symbol) f.value.token_symbol = pair.baseToken.symbol || '';
              if (!f.value.token_chain)  f.value.token_chain  = pair.chainId || chain;
            }
          } catch (_) {}
          finally { tokenLookupBusy.value = false; }
        }

        function onSubmit() {
          // If JSON tab active, merge JSON fields into f before submitting
          if (formTab.value === 'json' && jsonEditText.value.trim()) {
            jsonEditError.value = '';
            try {
              const o = JSON.parse(jsonEditText.value);
              const fieldMap = { name: 'name', website: 'website_url', github: 'github_url', twitter: 'twitter_url', telegram: 'telegram_url' };
              for (const [k, target] of Object.entries(fieldMap)) {
                if (o[k] !== undefined) f.value[target] = o[k];
              }
              if (o.symbol !== undefined) f.value.token_symbol   = o.symbol;
              if (o.contract !== undefined) f.value.token_contract = o.contract;
              if (o.contractAddress !== undefined) f.value.token_contract = o.contractAddress;
              if (o.chain !== undefined)   f.value.token_chain   = o.chain;
              if (o.chainId !== undefined) f.value.token_chain   = o.chainId;
              if (o.enabled !== undefined)  f.value.project_enabled = !!o.enabled;
            } catch (e) {
              jsonEditError.value = 'Invalid JSON: ' + e.message;
              return;
            }
          }
          // Convert empty strings → null so the DB gets real NULLs
          const p = { ...f.value };
          for (const k of Object.keys(p)) {
            if (p[k] === '') p[k] = null;
          }
          if (!p.name) { alert('Name is required'); return; }
          // Build token and enabled from flat form fields
          const token = (p.token_symbol || p.token_contract || p.token_chain)
            ? { symbol: p.token_symbol, contract: p.token_contract, chain: p.token_chain }
            : null;
          emit('submit', {
            name: p.name, website_url: p.website_url, github_url: p.github_url,
            twitter_url: p.twitter_url, telegram_url: p.telegram_url,
            website_enabled: p.website_enabled, website_content_check: p.website_content_check,
            github_enabled: p.github_enabled, twitter_enabled: p.twitter_enabled, telegram_enabled: p.telegram_enabled,
            token, enabled: p.project_enabled ? 1 : 0, price_enabled: p.price_enabled ? 1 : 0,
          });
        }

        return { f, onSubmit, jsonEditText, jsonEditError, formTab, lookupToken, tokenLookupBusy };
      },
    };

    /* ── RepoManager component ─────────────────────────────────────────────────
       Add/remove repos for a project. Lives inside ProjectCard.
       Props: projectId, githubUrl
       Emits: repos-updated
    ───────────────────────────────────────────────────────────────────────── */
    const RepoManager = {
      props: ['projectId', 'githubUrl', 'projectName'],
      emits: ['repos-updated'],
      template: `
        <div class="modal">
          <h2 style="font-size:1.2rem">Manage Repos — {{ projectName }}</h2>

          <!-- Current repos -->
          <div v-if="repos.length" style="margin-bottom:16px;">
            <table style="margin:0;">
              <tbody>
                <tr v-for="r in repos" :key="r.full_name">
                  <td style="white-space:nowrap"><input type="checkbox" :value="r.full_name" v-model="selectedToDelete" /></td>
                  <td style="width:100%">{{ r.full_name }}</td>
                  <td style="white-space:nowrap"><button class="secondary outline" @click="removeRepo(r)">×</button></td>
                </tr>
              </tbody>
            </table>
            <button v-if="selectedToDelete.length" class="secondary" style="margin-top:8px;" @click="deleteSelected">Delete Selected ({{ selectedToDelete.length }})</button>
          </div>
          <div v-else class="muted" style="margin-bottom:16px;">No repos monitored yet.</div>

          <!-- Manual add by full name -->
          <div style="display:flex;gap:6px;margin-bottom:12px;">
            <input v-model="manualName" type="text" placeholder="owner/repo-name" style="flex:1;" />
            <button class="secondary" :disabled="!manualName || adding" @click="manualAdd" style="padding:3x 5px; height:45px;">Add</button>
          </div>

          <!-- Fetch from GitHub -->
          <div class="form-group">
            <button class="secondary" :disabled="fetching" @click="fetchOrgsRepos">
              <span v-if="fetching" class="spinner"></span>
              <span v-else>↻ Fetch from GitHub</span>
            </button>
          </div>

          <!-- Org repo checklist -->
          <fieldset v-if="availableRepos.length">
            <legend>Add repos from GitHub</legend>
            <label v-for="r in availableRepos" :key="r.full_name">
              <input type="checkbox" :value="r" v-model="selected" />
              {{ r.full_name }} <span class="muted">({{ r.default_branch }}, ★{{ r.stars_count || 0 }})</span>
            </label>
          </fieldset>

          <div v-if="selected.length" style="margin-top:8px;">
            <button class="primary" :disabled="adding" @click="addSelected">
              <span v-if="adding" class="spinner"></span>
              <span v-else>Add Selected ({{ selected.length }})</span>
            </button>
          </div>

          <div class="modal-actions" style="margin-top:16px;">
            <button @click="$emit('repos-updated')">Done</button>
          </div>
        </div>
      `,
      setup(props, { emit }) {
        const repos    = ref([]);
        const orgRepos = ref([]);
        const selected = ref([]);
        const selectedToDelete = ref([]);
        const availableRepos = computed(() =>
          orgRepos.value.filter(r => !repos.value.some(m => m.full_name === r.full_name))
        );
        const fetching = ref(false);
        const adding   = ref(false);
        const manualName = ref('');

        async function loadRepos() {
          const p = await api.getProject(props.projectId);
          repos.value = p.repos || [];
        }
        loadRepos();

        async function fetchOrgsRepos() {
          fetching.value = true;
          try {
            const all = await api.getOrgRepos(props.projectId);
            orgRepos.value = all;
          } catch (e) {
            alert('Failed to fetch repos: ' + e.message);
          } finally {
            fetching.value = false;
          }
        }

        async function addSelected() {
          adding.value = true;
          try {
            await api.addRepos(props.projectId, selected.value);
            selected.value = [];
            orgRepos.value = [];
            await loadRepos();
            emit('repos-updated');
          } catch (e) {
            alert('Failed to add repos: ' + e.message);
          } finally {
            adding.value = false;
          }
        }

        async function removeRepo(r) {
          if (!confirm(`Remove ${r.full_name}?`)) return;
          try {
            await api.removeRepo(props.projectId, r.full_name);
            await loadRepos();
          } catch (e) {
            alert('Failed to remove repo: ' + e.message);
          }
        }

        async function manualAdd() {
          let name = manualName.value.trim()
            .replace(/^https:\/\/github\.com\//, '')
            .replace(/\.git$/, '');
          if (!name) return;
          const parts = name.split('/');
          const owner = parts[0] || '';
          const repo = parts[1] || name;
          try {
            await api.addRepos(props.projectId, [{
              full_name: `${owner}/${repo}`,
              repo_name: repo,
              repo_url: `https://github.com/${owner}/${repo}`,
              description: '',
              default_branch: '',
              pushed_at: null,
              stars_count: 0,
              language: null,
            }]);
            manualName.value = '';
            await loadRepos();
            emit('repos-updated');
          } catch (e) {
            alert('Failed to add repo: ' + e.message);
          }
        }

        async function deleteSelected() {
          const toDelete = [...selectedToDelete.value];
          if (!confirm(`Remove ${toDelete.length} repos?`)) return;
          try {
            for (const name of toDelete) {
              await api.removeRepo(props.projectId, name);
            }
            selectedToDelete.value = [];
            await loadRepos();
          } catch (e) {
            alert('Failed to remove repos: ' + e.message);
          }
        }

        return { repos, orgRepos, selected, selectedToDelete, availableRepos, fetching, adding, manualName, manualAdd, fetchOrgsRepos, addSelected, removeRepo, deleteSelected };
      },
    };

      components: { RepoList },

      template: `

          <!-- Token price summary (if project has a token) -->
          <div v-if="token" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:0 2px;">

            <a :href="'https://dexscreener.com/' + token.chain + '/' + token.contract" target="_blank" rel="noopener">{{ token.price_usd != null ? '$' + parseFloat(token.price_usd).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 6 }) : '—' }}</a>
            <span v-if="token.price_change_h1 != null" :class="['badge', token.price_change_h1 < 0 ? 'error' : 'ok']">1h  {{ fmtPct(token.price_change_h1) }}</span>

                <li v-for="r in project.deletedRepos" :key="r.full_name" class="repo" style="opacity:0.5;text-decoration:line-through;">
                  <div class="repo-name">{{ r.full_name }}</div>
                </li>
              </ul>
            </div>
          </section>

        </article>
      `,

      setup(props, { emit }) {
        const busy = ref(null);

        // project.*_status objects come from the dashboard API (latest check result per resource)
        const website = computed(() => props.project.website_status || {});
        const github  = computed(() => props.project.github_status  || {});
        const twitter = computed(() => props.project.twitter_status || {});
        const websiteLastChanged = computed(() => props.project.website_last_changed_at || null);
        const githubLastChanged  = computed(() => props.project.github_last_changed_at  || null);
        const twitterLastChanged = computed(() => props.project.twitter_last_changed_at || null);

        const token = computed(() => {
          if (!props.prices) return null;
          return props.prices.find(t => t.project_id === props.project.id) || null;
        });

        /**
         * Run a named check and emit 'refreshed' on success so the parent reloads data.
         * @param {string}   kind  - human-readable name for error messages
         * @param {Function} fn    - async function that calls one api.* method
         */
        async function runCheck(kind, fn) {
          busy.value = kind;
          try {
            await fn();
            emit('refreshed');
          } catch (e) {
            alert(`${kind} failed: ${e.message}`);
          } finally {
            busy.value = null;
          }
        }

        async function refreshAll() {
          busy.value = 'all';
          try {
            await Promise.all([
              props.project.twitter_url  && window.api.checkTwitter(props.project.id),
              props.project.website_url  && window.api.checkWebsite(props.project.id),
              props.project.github_url   && window.api.checkGithub(props.project.id),
            ].filter(Boolean));
            emit('refreshed');
          } catch (e) {
            alert(`Refresh all failed: ${e.message}`);
          } finally {
            busy.value = null;
          }
        }

        return {
          busy,
          website, github, twitter,
          websiteLastChanged, githubLastChanged, twitterLastChanged,
          token,
          runCheck,
          fmtPct, fmtShortNum,
          refreshAll,
          relativeTime,
          statusClass,
          // Expose api so the template's @click handlers can call api.checkWebsite(), etc.
          api: window.api,
          appSettings: window.appSettings,
        };
      },
    };

    /* ── Activity page ─────────────────────────────────────────────────────────
       Shows all projects (via dashboard API) and an optional recent log table.
       The dashboard endpoint returns projects with their latest status baked in.
    ───────────────────────────────────────────────────────────────────────── */
    const ActivityPage = {
      components: { ProjectCard, CheckLogList, StatusChangeList, AlertLogsList },

      template: `
        <div class="page">

          <div class="toolbar">
            <h1>Activity</h1>
          </div>

          <div class="tabs" style="margin: 0 20px; align-items: center;">
            <button :class="['tab', activityTab === 'resources' ? 'active' : '']" @click="activityTab = 'resources'">Resources</button>
            <button :class="['tab', activityTab === 'prices' ? 'active' : '']" @click="activityTab = 'prices'">Prices</button>
            <input
              v-model="filter"
              type="search"
              placeholder="Filter…"
              aria-label="Filter"
              class="search-input"
            />
          </div>

          <!-- Resources tab: project cards -->
          <div v-if="activityTab === 'resources'">

            <div v-if="error" class="[role="alert"]">{{ error }}</div>

            <div v-if="loading" class="center-loader">
              <span class="spinner lg"></span>
            </div>

            <div v-else-if="!projects.length" class="empty">
              No projects yet. Add one in the <a href="#/projects">Projects</a> tab.
            </div>

            <div v-else class="project-grid">
              <ProjectCard
                v-for="p in filteredProjects"
                :key="p.id"
                :project="p"
                :prices="prices"
                @refreshed="load"
              />
            </div>

          </div>

          <!-- Prices tab: token price table -->
          <div v-else-if="activityTab === 'prices'">

            <div v-if="pricesLoading" class="center-loader">
              <span class="spinner lg"></span>
            </div>

            <div v-else-if="!prices.length" class="empty" style="padding: 2rem 0;">
              No token prices yet. Add tokens to your enabled projects.
            </div>

            <div v-else class="table-wrapper">
              <table id="price-table" class="price-table">
                <thead>
                  <tr>
                    <th class="hide-sm" :class="['sortable', priceSort.col === 'project_name' ? (priceSort.desc ? 'sort-desc' : 'sort-asc') : '']" @click="sortCol('project_name')">Project</th>
                    <th :class="['sortable', priceSort.col === 'symbol' ? (priceSort.desc ? 'sort-desc' : 'sort-asc') : '']" @click="sortCol('symbol')">Symbol</th>
                    <th class="cen hide-sm" :class="['sortable', priceSort.col === 'pair_created_at' ? (priceSort.desc ? 'sort-desc' : 'sort-asc') : '']" @click="sortCol('pair_created_at')">Age</th>
                    <th class="cen" :class="['sortable', priceSort.col === 'price_usd' ? (priceSort.desc ? 'sort-desc' : 'sort-asc') : '']" @click="sortCol('price_usd')">Price</th>
                    <th class="cen" :class="['sortable', priceSort.col === 'price_change_h1' ? (priceSort.desc ? 'sort-desc' : 'sort-asc') : '']" @click="sortCol('price_change_h1')">1h</th>
                    <th class="cen" :class="['sortable', priceSort.col === 'price_change_h6' ? (priceSort.desc ? 'sort-desc' : 'sort-asc') : '']" @click="sortCol('price_change_h6')">6h</th>
                    <th class="cen" :class="['sortable', priceSort.col === 'price_change_h24' ? (priceSort.desc ? 'sort-desc' : 'sort-asc') : '']" @click="sortCol('price_change_h24')">24h</th>
                    <th :class="['sortable', priceSort.col === 'liquidity_usd' ? (priceSort.desc ? 'sort-desc' : 'sort-asc') : '']" @click="sortCol('liquidity_usd')">Liquidity</th>
                    <th class="hide-sm" :class="['sortable', priceSort.col === 'volume_h24' ? (priceSort.desc ? 'sort-desc' : 'sort-asc') : '']" @click="sortCol('volume_h24')">Volume 24h</th>
                    <th :class="['sortable', priceSort.col === 'market_cap' ? (priceSort.desc ? 'sort-desc' : 'sort-asc') : '']" @click="sortCol('market_cap')">MCap</th>
                    <th class="hide-sm" :class="['sortable', priceSort.col === 'chain' ? (priceSort.desc ? 'sort-desc' : 'sort-asc') : '']" @click="sortCol('chain')">Chain</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-for="row in filteredPrices" :key="row.project_id">
                    <td class="hide-sm">
                      <a :href="'https://dexscreener.com/' + row.chain + '/' + row.contract"
                         target="_blank" rel="noopener"
                         :title="row.project_name">
                        {{ row.project_name.length > 30 ? row.project_name.slice(0, 30) + '…' : row.project_name }}
                      </a>
                    </td>
                    <td>
                      <a :href="'https://x.com/search?q=%24' + (row.symbol.startsWith('$') ? row.symbol.slice(1) : row.symbol) + '&src=typed_query'"
                         target="_blank" rel="noopener">
                        {{ row.symbol || '—' }}
                      </a>
                    </td>
                    <td class="cen hide-sm">{{ row.pair_created_at ? relativeTime(row.pair_created_at) : '—' }}</td>
                    <td class="cen"><b>{{ row.price_usd ? '$' + parseFloat(row.price_usd).toFixed(6) : '—' }}</b></td>
                    <td :class="['cen', row.price_change_h1 < 0 ? 'neg' : row.price_change_h1 > 0 ? 'pos' : '']">{{ fmtPct(row.price_change_h1) }}</td>
                    <td :class="['cen', row.price_change_h6 < 0 ? 'neg' : row.price_change_h6 > 0 ? 'pos' : '']">{{ fmtPct(row.price_change_h6) }}</td>
                    <td :class="['cen', row.price_change_h24 < 0 ? 'neg' : row.price_change_h24 > 0 ? 'pos' : '']">{{ fmtPct(row.price_change_h24) }}</td>
                    <td class="num">{{ fmtShortNum(row.liquidity_usd) }}</td>
                    <td class="num hide-sm">{{ fmtShortNum(row.volume_h24) }}</td>
                    <td class="num"><b>{{ fmtShortNum(row.market_cap) }}</b></td>
                    <td class="hide-sm">{{ row.chain || '—' }}</td>
                  </tr>
                </tbody>
              </table>
            </div>

          </div>

          <!-- Recent logs table -->
          <section class="logs-section">
            <div class="tabs">
              <button :class="['tab', logTab === 'check-logs' ? 'active' : '']" @click="logTab = 'check-logs'">Check Logs</button>
              <button :class="['tab', logTab === 'status-changes' ? 'active' : '']" @click="logTab = 'status-changes'">Event Logs</button>
              <button :class="['tab', logTab === 'alert-logs' ? 'active' : '']" @click="logTab = 'alert-logs'">Alert Logs</button>
              <button class="refresh-btn" data-tooltip="Refresh data for current tab" @click="logTab === 'check-logs' ? loadLogs(1) : logTab === 'status-changes' ? loadStatusChanges(1) : loadAlertLogs(1)" aria-label="Refresh current tab">↻</button>
              <button v-if="autoRefreshEnabled" class="refresh-btn" :data-tooltip="pollingPaused ? 'Resume auto-refresh' : 'Pause auto-refresh'" @click="togglePolling" :aria-label="pollingPaused ? 'Resume auto-refresh' : 'Pause auto-refresh'">{{ pollingPaused ? '▶' : '⏸' }}</button>
              <input class="search-input" type="search" v-model="logSearch" placeholder="Search logs…" aria-label="Search logs" />
            </div>
            <article>
              <CheckLogList v-if="logTab === 'check-logs'" :logs="logs" :show-project="true"
                :page="logPage" :total="logTotal" :limit="logLimit" @change-page="loadLogs" />
              <StatusChangeList v-else-if="logTab === 'status-changes'" :logs="statusChanges" :show-project="true"
                :page="scPage" :total="scTotal" :limit="scLimit" @change-page="loadStatusChanges" />
              <AlertLogsList v-else :logs="alertLogs"
                :page="alertPage" :total="alertTotal" :limit="alertLimit" @change-page="loadAlertLogs" />
            </article>
          </section>

        </div>
      `,

      setup() {
        let pricesRefreshMs = 30_000;
        const activityTab   = ref(localStorage.getItem('pc_activity_tab') || 'prices');
        const filter        = ref('');
        const projects      = ref([]);
        const prices        = ref([]);
        const pricesLoading = ref(false);
        const logs          = ref([]);
        const statusChanges = ref([]);
        const alertLogs     = ref([]);
        const loading       = ref(true);
        const error         = ref('');
        const logTab        = ref(localStorage.getItem('pc_log_tab') || 'status-changes');

        // Pagination state for each tab
        const logPage   = ref(1);
        const logTotal  = ref(0);
        const logLimit  = ref(20);
        const scPage    = ref(1);
        const scTotal   = ref(0);
        const scLimit   = ref(15);
        const alertPage  = ref(1);
        const alertTotal = ref(0);
        const alertLimit = ref(20);
        const logSearch  = ref('');
        let logSearchTimer = null;

        watch(activityTab, v => localStorage.setItem('pc_activity_tab', v));
        watch(logTab, v => localStorage.setItem('pc_log_tab', v));
        watch(logSearch, () => {
          clearTimeout(logSearchTimer);
          logSearchTimer = setTimeout(() => {
            logLoaders[logTab.value]?.(1);
          }, 300);
        });
        const logLoaders = { 'check-logs': loadLogs, 'status-changes': loadStatusChanges, 'alert-logs': loadAlertLogs };

        /** Load dashboard (projects + status) */
        async function load() {
          loading.value = true;
          error.value   = '';
          try {
            projects.value = await api.getDashboard();
          } catch (e) {
            error.value = e.message;
          } finally {
            loading.value = false;
          }
          logLoaders[logTab.value]?.(1);
        }

        /** Load token prices */
        async function loadPrices() {
          pricesLoading.value = true;
          try {
            prices.value = await api.getTokenPrices();
            // Re-apply active sort after refresh so both rows and th arrow stay
            if (priceSort.value.col) {
              applyPriceSort(priceSort.value.col, priceSort.value.desc);
            }
          } catch (e) {
            console.error(e);
          } finally {
            pricesLoading.value = false;
          }
        }

        /** Load log entries for the current page */
        async function loadLogs(page = 1) {
          logPage.value = page;
          const offset = (page - 1) * logLimit.value;
          try {
            const r = await api.getCheckLogs({ limit: logLimit.value, offset, search: logSearch.value });
            logs.value = r.logs || [];
            logTotal.value = r.total || 0;
          } catch (e) {
            console.error(e);
          }
        }

        /** Load status-change entries for the current page */
        async function loadStatusChanges(page = 1) {
          scPage.value = page;
          const offset = (page - 1) * scLimit.value;
          try {
            const r = await api.getStatusChanges({ limit: scLimit.value, offset, search: logSearch.value });
            statusChanges.value = r.logs || [];
            scTotal.value = r.total || 0;
          } catch (e) {
            console.error(e);
          }
        }

        /** Load alert log entries for the current page */
        async function loadAlertLogs(page = 1) {
          alertPage.value = page;
          const offset = (page - 1) * alertLimit.value;
          try {
            const r = await api.getAlertLogs({ limit: alertLimit.value, offset, search: logSearch.value });
            alertLogs.value = r.logs || [];
            alertTotal.value = r.total || 0;
          } catch (e) {
            console.error(e);
          }
        }

        
        let pollTimer = null;
        let pricesTimer = null;
        const pollingPaused = ref(false);
        const autoRefreshEnabled = ref(false);

        function togglePolling() {
          if (pollingPaused.value) {
            pollingPaused.value = false;
            pollTimer = setInterval(load, (window.appSettings.value?.ui_refresh_seconds || 30) * 1000);
          } else {
            pollingPaused.value = true;
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
          }
        }

        onMounted(async () => {
          load();
          loadPrices();
          loadLogs(1);
          loadStatusChanges(1);
          loadAlertLogs(1);
          try {
            const cfg = await api.getSettings();
            window.appSettings.value = cfg;
            pricesRefreshMs = (cfg.ui_refresh_seconds || 30) * 1000;
            // Start prices refresh immediately since Prices is default
            pricesTimer = setInterval(loadPrices, pricesRefreshMs);
            if (cfg.ui_refresh_seconds) {
              autoRefreshEnabled.value = true;
              pollTimer = setInterval(() => { load(); }, cfg.ui_refresh_seconds * 1000);
            }
          } catch { /* auto-refresh disabled */ }
        });

        onUnmounted(() => {
          if (pollTimer) clearInterval(pollTimer);
          if (pricesTimer) clearInterval(pricesTimer);
        });

        // Watch activityTab to load/fetch prices when switching to Prices tab
        watch(() => activityTab.value, async (tab) => {
          if (tab === 'prices' && !prices.value.length) {
            loadPrices();
          }
          if (tab === 'prices') {
            if (pricesTimer) clearInterval(pricesTimer);
            pricesTimer = setInterval(loadPrices, pricesRefreshMs);
          } else {
            if (pricesTimer) { clearInterval(pricesTimer); pricesTimer = null; }
          }
        });

        // Sort state
        const priceSort = ref({ col: 'price_change_h6', desc: false });

        const filteredProjects = computed(() => {
          const q = filter.value.toLowerCase();
          if (!q) return projects.value;
          return projects.value.filter(p =>
            p.name.toLowerCase().includes(q) ||
            (p.website_url || '').toLowerCase().includes(q) ||
            (p.github_url || '').toLowerCase().includes(q)
          );
        });

        const filteredPrices = computed(() => {
          const q = filter.value.toLowerCase();
          if (!q) return prices.value;
          return prices.value.filter(p =>
            (p.project_name || '').toLowerCase().includes(q) ||
            (p.symbol || '').toLowerCase().includes(q) ||
            (p.chain || '').toLowerCase().includes(q)
          );
        });

        function applyPriceSort(col, desc) {
          const num = (v) => v == null || isNaN(v) ? -Infinity : parseFloat(v);
          const str = (v) => (v == null ? '' : String(v)).toLowerCase();
          prices.value = [...prices.value].sort((a, b) => {
            const va = a[col], vb = b[col];
            const cmp = ['project_name', 'symbol', 'chain'].includes(col)
              ? (str(va) < str(vb) ? -1 : str(va) > str(vb) ? 1 : 0)
              : (num(va) < num(vb) ? -1 : num(va) > num(vb) ? 1 : 0);
            return desc ? -cmp : cmp;
          });
        }

        function sortCol(col) {
          if (priceSort.value.col === col) {
            priceSort.value.desc = !priceSort.value.desc;
          } else {
            priceSort.value.col = col;
            priceSort.value.desc = true;
          }
          applyPriceSort(priceSort.value.col, priceSort.value.desc);
        }

        return {
          activityTab, projects, prices, pricesLoading,
          logs, statusChanges, alertLogs, loading, error, logTab,
          logPage, logTotal, logLimit, scPage, scTotal, scLimit, alertPage, alertTotal, alertLimit,
          logSearch,
          filter, filteredProjects, filteredPrices,
          load, loadPrices, loadLogs, loadStatusChanges, loadAlertLogs, sortCol, priceSort,
          pollingPaused, togglePolling, autoRefreshEnabled,
          api: window.api, relativeTime, fmtShortNum, fmtPct,
        };
      },
    };

    /* ── Projects page ─────────────────────────────────────────────────────────
       Table list of all projects with Create / Edit / Delete / JSON Import.
    ───────────────────────────────────────────────────────────────────────── */
    const ProjectsPage = {
      components: { ProjectForm, RepoManager },

      template: `
        <div class="page">

          <div class="toolbar">
            <h1>Projects</h1>
            <input v-model="projFilter" type="text" placeholder="Filter…" aria-label="Filter projects" style="margin: 10px 10px 0 0; width: 140px; padding: 2px 6px; font-size: 0.8125rem; height: 30px" />
            <button @click="exportProjects">Export JSON</button>
            <button @click="importOpen = true">Import JSON</button>
            <button class="primary" @click="openCreate">+ Add Project</button>
          </div>

          <div v-if="error" class="[role="alert"]">{{ error }}</div>

          <div v-if="loading" class="center-loader">
            <span class="spinner lg"></span>
          </div>

          <div v-else-if="!projects.length" class="empty">
            No projects yet. Click <strong>+ Add Project</strong> to start.
          </div>

          <div v-else>
            <table>
              <thead>
                <tr>
                  <th data-tooltip="Project name">Name</th>
                  <th data-tooltip="Website URL">Website</th>
                  <th data-tooltip="GitHub organization URL">GitHub</th>
                  <th data-tooltip="Twitter handle or URL">Twitter</th>
                  <th data-tooltip="Token info">Token</th>
                  <th class="col-actions"></th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="p in filteredProjects" :key="p.id" :class="{ disabled: !p.enabled }">
                  <td>{{ p.name }}</td>
                  <td><a v-if="p.website_url" :href="p.website_url" target="_blank" rel="noopener">{{ urlLabel(p.website_url) }}</a><span v-else>—</span></td>
                  <td><a v-if="p.github_url" :href="p.github_url" target="_blank" rel="noopener">{{ urlLabel(p.github_url) }}</a><span v-else>—</span></td>
                  <td><a v-if="p.twitter_url" :href="p.twitter_url" target="_blank" rel="noopener">{{ urlLabel(p.twitter_url) }}</a><span v-else>—</span></td>
                  <td><a v-if="p.token && tok(p).contract" :href="'https://dexscreener.com/' + tok(p).chain + '/' + tok(p).contract" target="_blank" rel="noopener">{{ tok(p).symbol }}</a><span v-else>—</span></td>
                  <td class="col-actions">
                    <button v-if="p.github_url" class="secondary" data-tooltip="Manage Repos" @click="openManageRepos(p)">⚙</button>
                    <button class="secondary" data-tooltip="Edit"   @click="openEdit(p)">✎</button>
                    <button class="secondary" data-tooltip="Delete" @click="onDelete(p)">🗑</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Create / Edit modal -->
          <div v-if="showForm" class="modal-backdrop" @click.self="showForm = false">
            <ProjectForm
              :initial="editing"
              :busy="submitting"
              @submit="onSubmit"
              @cancel="showForm = false"
            />
          </div>

          <!-- JSON import modal -->
          <div v-if="importOpen" class="modal-backdrop" @click.self="importOpen = false">
            <div class="modal">
              <h2>Import Projects from JSON</h2>
              <p class="muted">
                Paste JSON (object or array). Each item needs <code>name</code>;
                other fields optional.
              </p>

              <!-- File picker -->
              <div class="form-group">
                <input type="file" accept="application/json,.json" @change="onFile" />
              </div>

              <!-- Raw textarea -->
              <div class="form-group">
                <textarea
                  v-model="importText"
                  rows="10"
                  placeholder='[{"name":"Example","website":"https://example.com","github":"https://github.com/example","symbol":"JTVO","contractAddress":"...","chainId":"solana","enabled":true}]'
                ></textarea>
              </div>

              <div class="modal-actions">
                <button @click="importOpen = false">Cancel</button>
                <button
                  class="primary"
                  :disabled="importing || !importText.trim()"
                  @click="onImport"
                >
                  <span v-if="importing" class="spinner"></span>
                  <span v-else>Import</span>
                </button>
              </div>
            </div>
          </div>

          <!-- RepoManager modal -->
          <div v-if="manageProject" class="modal-backdrop" @click.self="manageProject = null">
            <RepoManager
              :projectId="manageProject.id"
              :githubUrl="manageProject.github_url"
              :projectName="manageProject.name"
              @repos-updated="manageProject = null"
            />
          </div>

        </div>
      `,

      setup() {
        const projects   = ref([]);
        const loading   = ref(true);
        const error     = ref('');
        const showForm  = ref(false);  // create/edit modal visibility
        const editing   = ref(null);    // project being edited (null = create)
        const submitting = ref(false);
        const importOpen  = ref(false); // JSON import modal visibility
        const importText  = ref('');    // raw JSON string in the import textarea
        const importing   = ref(false);
        const manageProject = ref(null); // project for RepoManager modal
        const lastGithubImport = ref(null); // import-created project needing repo setup
        const projFilter = ref('');

        const filteredProjects = computed(() => {
          const q = projFilter.value.toLowerCase();
          if (!q) return projects.value;
          return projects.value.filter(p =>
            p.name.toLowerCase().includes(q) ||
            (p.website_url || '').toLowerCase().includes(q) ||
            (p.github_url || '').toLowerCase().includes(q)
          );
        });

        /** Fetch all projects from the API */
        async function load() {
          loading.value = true;
          error.value   = '';
          try {
            projects.value = await api.listProjects();
          } catch (e) {
            error.value = e.message;
          } finally {
            loading.value = false;
          }
        }

        function openCreate() { editing.value = null; showForm.value = true; }
        function openEdit(p)   { editing.value = p;    showForm.value = true; }
        function openManageRepos(p) { manageProject.value = p; }

        /** Create or update a project, then reload the list */
        async function onSubmit(payload) {
          submitting.value = true;
          error.value      = '';
          try {
            if (editing.value) {
              await api.updateProject(editing.value.id, payload);
            } else {
              const created = await api.createProject(payload);
              if (payload.github_url) {
                const fresh = projects.value.find(p => p.id === created.id);
                if (fresh) openManageRepos(fresh);
              }
            }
            showForm.value  = false;
            editing.value   = null;
            await load();
          } catch (e) {
            error.value = e.message;
          } finally {
            submitting.value = false;
          }
        }

        /** Delete a project after user confirmation */
        async function onDelete(p) {
          const msg = `Delete "${p.name}"? This removes its repos and check logs.`;
          if (!confirm(msg)) return;
          try {
            await api.deleteProject(p.id);
            await load();
          } catch (e) {
            error.value = e.message;
          }
        }

        /**
         * Import one or more projects from the JSON textarea.
         * Accepts a single object or an array of objects.
         * Field mapping (import format → API):
         *   name,  website,  github,  twitter,  telegram
         */
        async function onImport() {
          let parsed;
          try {
            parsed = JSON.parse(importText.value);
          } catch (e) {
            error.value = 'Invalid JSON: ' + e.message;
            return;
          }
          const list = Array.isArray(parsed) ? parsed : [parsed];

          importing.value = true;
          error.value     = '';
          let ok = 0, failed = 0;

          for (const item of list) {
            try {
              const hasWebsite = !!item.website;
              const tok = (item.symbol || item.contractAddress || item.chainId)
                ? { symbol: item.symbol || null, contract: item.contractAddress || null, chain: item.chainId || null }
                : null;
              const created = await api.createProject({
                name:                   item.name,
                website_url:            item.website,
                github_url:             item.github,
                twitter_url:            item.twitter,
                telegram_url:           item.telegram,
                website_enabled:        hasWebsite,
                website_content_check:  hasWebsite,
                token:                  tok,
                enabled:                item.enabled !== undefined ? (item.enabled ? 1 : 0) : 1,
              });
              ok++;
              if (item.github) lastGithubImport.value = created;
            } catch (e) {
              failed++;
            }
          }

          importing.value   = false;
          importOpen.value   = false;
          importText.value    = '';
          if (failed) error.value = `Imported ${ok}, ${failed} failed.`;
          await load();
          if (lastGithubImport.value) {
            const fresh = projects.value.find(p => p.id === lastGithubImport.value.id);
            if (fresh) openManageRepos(fresh);
            lastGithubImport.value = null;
          }
        }

        /** Export all projects as JSON (same format as import) */
        function exportProjects() {
          const data = projects.value.map(p => {
            const t = tok(p);
            return {
              name:     p.name,
              website:  p.website_url,
              github:   p.github_url,
              twitter:  p.twitter_url,
              symbol:        t.symbol || null,
              contractAddress: t.contract || null,
              chainId:       t.chain || null,
              enabled:       p.enabled,
            };
          });
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'projects.json';
          a.click();
          URL.revokeObjectURL(a.href);
        }

        /** Read a File into the textarea via FileReader */
        function onFile(e) {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => { importText.value = String(reader.result || ''); };
          reader.readAsText(file);
        }

        onMounted(load);

        function tok(p) {
          return p.token ? (typeof p.token === 'string' ? JSON.parse(p.token) : p.token) : {};
        }

        return {
          projects, filteredProjects, loading, error, showForm, editing, submitting,
          importOpen, importText, importing, manageProject, lastGithubImport,
          projFilter,
          openCreate, openEdit, openManageRepos,
          onSubmit, onDelete, onImport, onFile, exportProjects,
          urlLabel, tok,
          api: window.api,
        };
      },
    };

    /* ── Settings page ─────────────────────────────────────────────────────────

       - Saves updates via PUT /api/settings
       - Trigger buttons call POST /api/settings/trigger-all
       - Clear Data empties projects/repos/logs tables but keeps config

    const SettingsPage = {
      template: `

      setup() {
        const settings    = ref(null);

          log_retention_days:        7,
          log_retention_enabled:     false,
          ui_refresh_seconds:        60,
          ui_refresh_enabled:        false,
          showDangerZone:           false,
          compact_activity:         false,
          github_alert_minutes:       60,
          github_alert_stop_minutes:  1440,
          website_alert_minutes:      60,
          website_alert_stop_minutes:  1440,
          twitter_alert_minutes:       60,
          twitter_alert_stop_minutes:  1440,
          github_token:               '',
          telegram_enabled:         false,
          telegram_bot_token:       '',
          telegram_chat_id:         '',
          pushbullet_enabled:       false,
          pushbullet_access_token:  '',
          price_alerts: [
            { price_change: 10, price_interval: 5, enabled: 1, telegram: 1, pushbullet: 1, log: 1, _enabled: true, _telegram: true, _pushbullet: true, _log: true },
            { price_change: 25, price_interval: 15, enabled: 1, telegram: 1, pushbullet: 1, log: 1, _enabled: true, _telegram: true, _pushbullet: true, _log: true },
            { price_change: 50, price_interval: 60, enabled: 1, telegram: 1, pushbullet: 1, log: 1, _enabled: true, _telegram: true, _pushbullet: true, _log: true },

        });
        const loading   = ref(true);
        const saving    = ref(false);
        const triggering = ref(null);  // which trigger is running: 'web' | 'gh' | 'tw'

        const clearingLogs  = ref(false);
        const clearingAlerts = ref(false);
        const error      = ref('');

        /**
         * Extract the interval (in minutes) for a given check type from the settings object.
         * Tries several possible response shapes for backwards compatibility.
         */
        function pickMinutes(s, kind) {
          if (!s) return 360;
          // Flat shape: { github_check_minutes: 360, website_check_minutes: 1440, ... }
          const d = s[kind + '_check_minutes'];
          if (d != null) return d;
          // Backward compat: commit_check_minutes

            const b = s.commit_check_minutes;
            if (b != null) return b;
          }
          return 360;
        }

        /** Load settings from GET /api/settings */
        async function load() {
          loading.value = true;
          error.value   = '';

            settings.value = await api.getSettings();

              github_interval_minutes:   pickMinutes(settings.value, 'github'),
              website_interval_minutes:  pickMinutes(settings.value, 'website'),
              twitter_interval_minutes: pickMinutes(settings.value, 'twitter'),
              log_retention_days:   settings.value.log_retention_days || 7,
              log_retention_enabled: !!settings.value.log_retention_days,

              ui_refresh_enabled:    !!settings.value.ui_refresh_seconds,
              compact_activity:     !!settings.value.compact_activity,
              github_alert_minutes:      settings.value.github_alert_minutes ?? 60,
              github_alert_stop_minutes:  settings.value.github_alert_stop_minutes ?? 1440,
              website_alert_minutes:      settings.value.website_alert_minutes ?? 60,
              website_alert_stop_minutes:  settings.value.website_alert_stop_minutes ?? 1440,
              twitter_alert_minutes:      settings.value.twitter_alert_minutes ?? 60,
              twitter_alert_stop_minutes:  settings.value.twitter_alert_stop_minutes ?? 1440,
              github_token:              settings.value.github_token || '',
              telegram_enabled:         !!settings.value.telegram?.enabled,
              telegram_bot_token:        settings.value.telegram?.bot_token || '',
              telegram_chat_id:          settings.value.telegram?.chat_id || '',
              pushbullet_enabled:       !!settings.value.pushbullet?.enabled,
              pushbullet_access_token:   settings.value.pushbullet?.access_token || '',
              price_alerts: (settings.value.price_alerts?.alerts || []).map(a => ({
                price_change:   a.price_change ?? 10,

                pushbullet:     a.pushbullet ?? 0,
                log:            a.log ?? 1,
