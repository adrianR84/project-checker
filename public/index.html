                <tr v-for="row in filteredPrices" :key="row.project_id" :class="priceRowTint[row.project_id]">
                  <td class="hide-sm" style="cursor:pointer" :title="row.contract" @click="copyContract(row)">
                    {{ row.project_name.length > 20 ? row.project_name.slice(0, 20) + '…' : row.project_name }}
                  </td>
                  <td>
                    <a :href="'https://x.com/search?q=%24' + (row.symbol.startsWith('$') ? row.symbol.slice(1) : row.symbol) + '&src=typed_query'"
                        target="_blank" rel="noopener">
                      {{ row.symbol || '—' }}
                    </a>
                  </td>
                  <td class="cen">
                    <a v-if="row.github_url" :href="row.github_url" target="_blank" rel="noopener" title="GitHub">
                      <span class="icon icon-github"></span>
                    </a>
                    <span v-else>—</span>
                  </td>
                  <td class="cen">
                    <a v-if="row.twitter_url" :href="row.twitter_url" target="_blank" rel="noopener" title="Twitter — Click for iframe modal, Ctrl+click for new tab" @click="e => !e.ctrlKey && (e.preventDefault(), openIframe('https://nitter.net' + row.twitter_url.replace('https://x.com','').replace('https://twitter.com',''), 'Twitter'))">
                      <span class="icon icon-twitter"></span>
                    </a>
                    <span v-else>—</span>
                  </td>
                  <td class="cen">
                    <a v-if="row.website_url" :href="row.website_url" target="_blank" rel="noopener" title="Website — Click for iframe modal, Ctrl+click for new tab" @click="e => !e.ctrlKey && (e.preventDefault(), openIframe(row.website_url, 'Website', '1200px'))">
                      <span class="icon icon-website"></span>
                    </a>
                    <span v-else>—</span>
                  </td>
                  <td class="cen hide-sm">{{ row.pair_created_at ? relativeTime(row.pair_created_at) : '—' }}</td>
                  <td class="cen">
                    <a v-if="row.price_usd" :href="'https://dexscreener.com/' + row.chain + '/' + row.contract"
                        target="_blank" rel="noopener"
                        :title="row.symbol + ' on DexScreener'">
                      <b>{{ '$' + parseFloat(row.price_usd).toFixed(6) }}</b>
                    </a>
                    <span v-else>—</span>
                  </td>
                  <td class="cen hide-sm" :class="priceCellTint[row.project_id + '-price_change_h1'] || []">{{ fmtPct(row.price_change_h1) }}</td>
                  <td class="cen" :class="priceCellTint[row.project_id + '-price_change_h6'] || []">{{ fmtPct(row.price_change_h6) }}</td>
                  <td class="cen" :class="priceCellTint[row.project_id + '-price_change_h24'] || []">{{ fmtPct(row.price_change_h24) }}</td>
                  <td class="num hide-sm">{{ fmtShortNum(row.liquidity_usd) }}</td>
                  <td class="num hide-sm">{{ fmtShortNum(row.volume_h24) }}</td>
                  <td class="num"><b>{{ fmtShortNum(row.market_cap) }}</b></td>
                  <td class="cen">
                    <input type="checkbox" :checked="!!row.price_enabled" @change.stop="togglePriceEnabled(row, $event)" title="Track price changes" />
                  </td>
                </tr>
              </tbody>
            </table>

          </div>

          <!-- Recent logs table -->
          <section class="logs-section" id="logs">
            <div class="tabs">
              <button :class="['tab', logTab === 'check-logs' ? 'active' : '']" @click="logTab = 'check-logs'">Check Logs</button>
              <button :class="['tab', logTab === 'status-changes' ? 'active' : '']" @click="logTab = 'status-changes'">Event Logs</button>
              <button :class="['tab', logTab === 'alert-logs' ? 'active' : '']" @click="logTab = 'alert-logs'">Alert Logs</button>
              <button class="refresh-btn" data-tooltip="Refresh data for current tab" @click="logTab === 'check-logs' ? loadLogs(1) : logTab === 'status-changes' ? loadStatusChanges(1) : loadAlertLogs(1)" aria-label="Refresh current tab">↻</button>
              <button v-if="autoRefreshEnabled" class="refresh-btn" :data-tooltip="pollingPaused ? 'Resume auto-refresh' : 'Pause auto-refresh'" @click="togglePolling" :aria-label="pollingPaused ? 'Resume auto-refresh' : 'Pause auto-refresh'">{{ pollingPaused ? '▶' : '⏸' }}</button>
              <input class="search-input" type="search" v-model="logSearch" placeholder="Search logs…" aria-label="Search logs" />
            </div>
            <div>
              <CheckLogList v-if="logTab === 'check-logs'" :logs="logs" :show-project="true"
                :page="logPage" :total="logTotal" :limit="logLimit" @change-page="loadLogs" />
              <StatusChangeList v-else-if="logTab === 'status-changes'" :logs="statusChanges" :show-project="true"
                :page="scPage" :total="scTotal" :limit="scLimit" @change-page="loadStatusChanges" @refresh="loadStatusChanges(scPage)" />
              <AlertLogsList v-else :logs="alertLogs"
                :page="alertPage" :total="alertTotal" :limit="alertLimit" @change-page="loadAlertLogs" />
            </div>
          </section>

        </div>
      `,

      setup() {
        let pricesRefreshMs = 30_000;
        const activityTab   = ref(localStorage.getItem('pc_activity_tab') || 'prices');
        const filter        = ref('');
        const projects      = ref([]);
        const prices        = ref([]);
        const pricesLoading = ref(false);
        const logs          = ref([]);
        const statusChanges = ref([]);
        const alertLogs     = ref([]);
        const openIframe    = inject('openIframe');
        const loading       = ref(true);
        const error         = ref('');
        const logTab        = ref(localStorage.getItem('pc_log_tab') || 'status-changes');

        // Pagination state for each tab
        const logPage   = ref(1);
        const logTotal  = ref(0);
        const logLimit  = ref(20);
        const scPage    = ref(1);
        const scTotal   = ref(0);
        const scLimit   = ref(20);
        const alertPage  = ref(1);
        const alertTotal = ref(0);
        const alertLimit = ref(20);
        const logSearch  = ref('');
        let logSearchTimer = null;

        watch(activityTab, v => localStorage.setItem('pc_activity_tab', v));
        watch(logTab, v => localStorage.setItem('pc_log_tab', v));
        watch(logSearch, () => {
          clearTimeout(logSearchTimer);
          logSearchTimer = setTimeout(() => {
            logLoaders[logTab.value]?.(1);
          }, 300);
        });
        const logLoaders = { 'check-logs': loadLogs, 'status-changes': loadStatusChanges, 'alert-logs': loadAlertLogs };

        /** Load dashboard (projects + status) */
        async function load() {
          loading.value = true;
          error.value   = '';
          try {
            projects.value = await api.getDashboard();
          } catch (e) {
            error.value = e.message;
          } finally {
            loading.value = false;
          }
          logLoaders[logTab.value]?.(1);
        }

        /** Load token prices */
        async function loadPrices() {
          pricesLoading.value = true;
          try {
            let fresh = await api.getTokenPrices();
            if (priceSort.value.col) {
              const col = priceSort.value.col, desc = priceSort.value.desc;
              const num = v => v == null || isNaN(v) ? -Infinity : parseFloat(v);
              const str = v => (v == null ? '' : String(v)).toLowerCase();
              fresh = [...fresh].sort((a, b) => {
                const va = a[col], vb = b[col];
                const cmp = ['project_name', 'symbol', 'chain'].includes(col)
                  ? (str(va) < str(vb) ? -1 : str(va) > str(vb) ? 1 : 0)
                  : (num(va) < num(vb) ? -1 : num(va) > num(vb) ? 1 : 0);
                return desc ? -cmp : cmp;
              });
            }
            prices.value = fresh;
          } catch (e) {
            console.error(e);
          } finally {
            pricesLoading.value = false;
          }
        }

        /** Load log entries for the current page */
        async function loadLogs(page = 1) {
          logPage.value = page;
          const offset = (page - 1) * logLimit.value;
          try {
            const r = await api.getCheckLogs({ limit: logLimit.value, offset, search: logSearch.value });
            logs.value = r.logs || [];
            logTotal.value = r.total || 0;
          } catch (e) {
            console.error(e);
          }
        }

        /** Load status-change entries for the current page */
        async function loadStatusChanges(page = 1) {
          scPage.value = page;
          const offset = (page - 1) * scLimit.value;
          try {
            const r = await api.getStatusChanges({ limit: scLimit.value, offset, search: logSearch.value });
            statusChanges.value = r.logs || [];
            scTotal.value = r.total || 0;
          } catch (e) {
            console.error(e);
          }
        }

        /** Load alert log entries for the current page */
        async function loadAlertLogs(page = 1) {
          alertPage.value = page;
          const offset = (page - 1) * alertLimit.value;
          try {
            const r = await api.getAlertLogs({ limit: alertLimit.value, offset, search: logSearch.value });
            alertLogs.value = r.logs || [];
            alertTotal.value = r.total || 0;
          } catch (e) {
            console.error(e);
          }
        }

        
        let pollTimer = null;
        let pricesTimer = null;
        const pollingPaused = ref(false);
        const autoRefreshEnabled = ref(false);

        function togglePolling() {
          if (pollingPaused.value) {
            pollingPaused.value = false;
            pollTimer = setInterval(load, (sharedSettings.value?.ui_refresh_seconds || 30) * 1000);
          } else {
            pollingPaused.value = true;
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
          }
        }

        onMounted(async () => {
          load();
          loadPrices();
          loadLogs(1);
          loadStatusChanges(1);
          loadAlertLogs(1);
          try {
            const cfg = await api.getSettings();
            sharedSettings.value = cfg;
            pricesRefreshMs = (cfg.ui_refresh_seconds || 30) * 1000;
            // Start prices refresh immediately since Prices is default
            pricesTimer = setInterval(loadPrices, pricesRefreshMs);
            if (cfg.ui_refresh_seconds) {
              autoRefreshEnabled.value = true;
              pollTimer = setInterval(() => { load(); }, cfg.ui_refresh_seconds * 1000);
            }
          } catch { /* auto-refresh disabled */ }
        });

        onUnmounted(() => {
          if (pollTimer) clearInterval(pollTimer);
          if (pricesTimer) clearInterval(pricesTimer);
        });

        // Watch activityTab to load/fetch prices when switching to Prices tab
        watch(() => activityTab.value, async (tab) => {
          if (tab === 'prices' && !prices.value.length) {
            loadPrices();
          }
          if (tab === 'prices') {
            if (pricesTimer) clearInterval(pricesTimer);
            pricesTimer = setInterval(loadPrices, pricesRefreshMs);
          } else {
            if (pricesTimer) { clearInterval(pricesTimer); pricesTimer = null; }
          }
        });

        // Sort state
        const priceSort = ref({ col: 'price_change_h6', desc: false });

        const filteredProjects = computed(() => {
          const q = filter.value.toLowerCase();
          const all = q
            ? projects.value.filter(p =>
                p.name.toLowerCase().includes(q) ||
                (p.website_url || '').toLowerCase().includes(q) ||
                (p.github_url || '').toLowerCase().includes(q)
              )
            : projects.value;

          // Most recent event timestamp across the three resource types
          const recentTs = p => {
            const ts = [p.website_last_changed_at, p.github_last_changed_at, p.twitter_last_changed_at]
              .filter(Boolean)
              .sort((a, b) => b.localeCompare(a));
            return ts[0] || '';
          };

          return [...all].sort((a, b) => {
            if (a.has_unconfirmed !== b.has_unconfirmed) return a.has_unconfirmed ? -1 : 1;
            return recentTs(b).localeCompare(recentTs(a));
          });
        });

        const filteredPrices = computed(() => {
          const q = filter.value.toLowerCase();
          if (!q) return prices.value;
          return prices.value.filter(p =>
            (p.project_name || '').toLowerCase().includes(q) ||
            (p.symbol || '').toLowerCase().includes(q) ||
            (p.chain || '').toLowerCase().includes(q)
          );
        });

        // Shared: normalize price_for ('6h') to column suffix ('h6')
        const priceChangeCol = (price_for) =>
          `price_change_${price_for.endsWith('h') ? 'h' + price_for.slice(0, -1) : price_for}`;

        // Pre-index enabled alerts by suffix — O(1) lookup instead of O(alerts) scan per cell
        const alertsBySuffix = computed(() => {
          const map = { h1: [], h6: [], h24: [] };
          for (const a of sharedSettings.value?.price_alerts?.alerts || []) {
            if (!a.enabled) continue;
            const norm = a.price_for.endsWith('h') ? 'h' + a.price_for.slice(0, -1) : a.price_for;
            if (map[norm]) map[norm].push(a);
          } 
          return map;
        });

        // Intensity tier: highest matched threshold → strong, middle → medium, lowest → light
        const INTENSITY = ['light', 'medium', 'strong'];
        const getTierIndex = (priceChange, alerts) => {
          const thresholds = [...new Set(alerts.map(a => a.price_change))].sort((a, b) => b - a);
          if (thresholds.length === 1) return 2; // single threshold → strong
          const idx = thresholds.indexOf(priceChange);
          return Math.max(0, thresholds.length - 1 - idx);
        };

        const togglePriceEnabled = async (row, evt) => {
          const newVal = evt.target.checked ? 1 : 0;
          const prev = row.price_enabled;
          row.price_enabled = newVal;
          try {
            await api.updateProject(row.project_id, { price_enabled: newVal });
          } catch (e) {
            row.price_enabled = prev;
            console.error('Failed to update price_enabled:', e);
          }
        };

        const priceRowTint = computed(() => {
          const rows = {};
          const bySuffix = alertsBySuffix.value;
          for (const row of filteredPrices.value) {
            if (!row.price_enabled) { rows[row.project_id] = ''; continue; }
            let cls = '';
            const suffixOrder = ['h24', 'h6', 'h1'];
            outer:
            for (const suffix of suffixOrder) {
              const alerts = bySuffix[suffix];
              if (!alerts?.length) continue;
              const col = `price_change_${suffix}`;
              const val = row[col];
              if (val == null) continue;
              for (const a of alerts) {
                if (Math.abs(val) >= a.price_change) {
                  cls = val < 0 ? 'row-down' : 'row-up';
                  break outer;
                }
              }
            }
            rows[row.project_id] = cls;
          }
          return rows;
        });

        const priceCellTint = computed(() => {
          const cells = {};
          const bySuffix = alertsBySuffix.value;
          const suffixes = ['h1', 'h6', 'h24'];
          for (const row of filteredPrices.value) {
            for (const suffix of suffixes) {
              const col = `price_change_${suffix}`;
              const val = row[col];
              if (val == null) continue;
              const key = `${row.project_id}-${col}`;
              const dir = val < 0 ? 'neg' : 'pos';
              if (row.price_enabled) {
                const matching = bySuffix[suffix].filter(a => Math.abs(val) >= a.price_change);
                if (matching.length) {
                  const winningThreshold = Math.max(...matching.map(a => a.price_change));
                  const tier = getTierIndex(winningThreshold, bySuffix[suffix]);
                  cells[key] = [dir, `cell-${dir === 'neg' ? 'down' : 'up'}-${INTENSITY[tier]}`];
                } else {
                  cells[key] = [dir];
                }
              } else {
                cells[key] = [dir];
              }
            }
          }
          return cells;
        });

        function applyPriceSort(col, desc) {
          const num = (v) => v == null || isNaN(v) ? -Infinity : parseFloat(v);
          const str = (v) => (v == null ? '' : String(v)).toLowerCase();
          prices.value = [...prices.value].sort((a, b) => {
            const va = a[col], vb = b[col];
            const cmp = ['project_name', 'symbol', 'chain'].includes(col)
              ? (str(va) < str(vb) ? -1 : str(va) > str(vb) ? 1 : 0)
              : (num(va) < num(vb) ? -1 : num(va) > num(vb) ? 1 : 0);
            return desc ? -cmp : cmp;
          });
        }

        function sortCol(col) {
          if (priceSort.value.col === col) {
            priceSort.value.desc = !priceSort.value.desc;
          } else {
            priceSort.value.col = col;
            priceSort.value.desc = true;
          }
          applyPriceSort(priceSort.value.col, priceSort.value.desc);
        }

        function scrollToTop() {
          const el = document.getElementById('activity-tabs');
          if (el) {
            const top = el.getBoundingClientRect().top + window.scrollY - 60;
            window.scrollTo({ top, behavior: 'smooth' });
          }
        }
        function scrollToLogs() {
          const el = document.getElementById('logs');
          if (el) {
            const top = el.getBoundingClientRect().top + window.scrollY - 60;
            window.scrollTo({ top, behavior: 'smooth' });
          }
        }

        // Sync pagination limits from settings
        watch(() => sharedSettings.value?.logs_per_page, (val) => {
          if (val) {
            logLimit.value = val;
            scLimit.value = val;
            alertLimit.value = val;
          }
        });

        return {
          activityTab, projects, prices, pricesLoading,
          logs, statusChanges, alertLogs, loading, error, logTab,
          logPage, logTotal, logLimit, scPage, scTotal, scLimit, alertPage, alertTotal, alertLimit,
          logSearch,
          filter, filteredProjects, filteredPrices, priceRowTint, priceCellTint,
          load, loadPrices, loadLogs, loadStatusChanges, loadAlertLogs, sortCol, priceSort,
          pollingPaused, togglePolling, autoRefreshEnabled, togglePriceEnabled,
          api: window.api, relativeTime, fmtShortNum, fmtPct, copyContract, openIframe,
          scrollToTop, scrollToLogs,
        };
      },
    };

    /* ── Projects page ─────────────────────────────────────────────────────────
       Table list of all projects with Create / Edit / Delete / JSON Import.
    ───────────────────────────────────────────────────────────────────────── */
    const ProjectsPage = {
      components: { ProjectForm, RepoManager },

      template: `
        <div class="page">

          <div class="toolbar">
            <h2>Projects</h2>
            <input v-model="projFilter" type="search" placeholder="Filter…" aria-label="Filter projects" style="margin: 10px 10px 0 0; width: 160px; padding: 2px 12px 2px 40px; height: 40px" />
            <button v-if="selected.length" class="secondary" @click="onBulkEnable">Enable ({{ selected.length }})</button>
            <button v-if="selected.length" class="secondary" @click="onBulkDisable">Disable ({{ selected.length }})</button>
            <button v-if="selected.length" class="secondary" @click="onBulkDelete">Delete ({{ selected.length }})</button>
            <button @click="exportProjects">Export JSON</button>
            <button @click="openModal('import')">Import JSON</button>
            <button class="primary" @click="openCreate">+ Add Project</button>
          </div>

          <div v-if="error" class="[role="alert"]">{{ error }}</div>

          <div v-if="loading" class="center-loader">
            <span class="spinner lg"></span>
          </div>

          <div v-else-if="!projects.length" class="empty">
            No projects yet. Click <strong>+ Add Project</strong> to start.
          </div>

          <div style="overflow-x: scroll;" v-else>
            <table class="compact">
              <thead>
                <tr>
                  <th style="width:2.5em"><input type="checkbox" :checked="selected.length === filteredProjects.length && filteredProjects.length > 0" @change="toggleSelectAll" /></th>
                  <th class="project_cell" data-tooltip="Project name">Name</th>
                  <th class="resource_cell" data-tooltip="Website URL">Website</th>
                  <th class="action_cell" data-tooltip="Website enabled">WE</th>
                  <th class="resource_cell" data-tooltip="GitHub organization URL">GitHub</th>
                  <th class="action_cell" data-tooltip="GitHub enabled">GE</th>
                  <th class="resource_cell" data-tooltip="Twitter handle or URL">Twitter</th>
                  <th class="action_cell" data-tooltip="Twitter enabled">TE</th>
                  <th class="type_cell" data-tooltip="Token info">Token</th>
                  <th class="action_cell" data-tooltip="Token enabled">TE</th>
                  <th class="col-actions" class="text-right">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="p in filteredProjects" :key="p.id" :class="{ disabled: !p.enabled }">
                  <td><input type="checkbox" :checked="selected.includes(p.id)" @change="toggleSelect(p.id)" /></td>
                  <td>{{ trimName(p.name) }}</td>
                  <td v-html="projectIconLink(p, 'website', p.website_url)"></td>
                  <td :class="p.website_enabled ? 'muted' : 'alert'">{{ p.website_enabled ? '✓' : '✗' }}</td>
                  <td v-html="projectIconLink(p, 'github', p.github_url)"></td>
                  <td :class="p.github_enabled ? 'muted' : 'alert'">{{ p.github_enabled ? '✓' : '✗' }}</td>
                  <td v-html="projectIconLink(p, 'twitter', p.twitter_url)"></td>
                  <td :class="p.twitter_enabled ? 'muted' : 'alert'">{{ p.twitter_enabled ? '✓' : '✗' }}</td>
                  <td><a v-if="p.token && tok(p).contract" :href="'https://dexscreener.com/' + tok(p).chain + '/' + tok(p).contract" target="_blank" rel="noopener">{{ tok(p).symbol }}</a><span v-else>—</span></td>
                  <td :class="p.token_enabled ? 'muted' : 'alert'">{{ p.token_enabled ? '✓' : '✗' }}</td>
                  <td class="col-actions">
                    <button v-if="p.github_url" class="secondary" data-tooltip="Manage Repos" @click="openManageRepos(p)">⚙</button>
                    <button class="secondary" data-tooltip="Edit"   @click="openEdit(p)">✎</button>
                    <button class="secondary" data-tooltip="Delete" @click="onDelete(p)">🗑</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="modal-backdrop" :class="{ active: activeModal !== null }" @click="modalClosable && closeModal()"></div>

          <!-- Create / Edit modal -->
          <div class="modal" :class="{ active: isActive('form') }" :style="modalWidth ? { 'max-width': modalWidth } : {}" @click.self="modalClosable && closeModal()">
            <header class="modal-header">
              <h3 style="margin:0;font-size:1.1rem;">{{ editing ? 'Edit Project' : 'New Project' }}</h3>
              <button type="button" class="modal-close-btn" aria-label="Close" @click="closeModal">×</button>
            </header>
            <div class="modal-body">
              <ProjectForm
                :initial="editing"
                :busy="submitting"
                @submit="onFormSubmit"
                @cancel="closeModal"
              />
            </div>
          </div>

          <!-- JSON import modal -->
          <div class="modal" :class="{ active: isActive('import') }" :style="modalWidth ? { 'max-width': modalWidth } : {}" @click.self="modalClosable && closeModal()">
            <header class="modal-header">
              <h3 style="margin:0;">Import Projects from JSON</h3>
              <button type="button" class="modal-close-btn" aria-label="Close" @click="closeModal">×</button>
            </header>
            <div class="modal-body">
              <p class="muted">
                Paste JSON (object or array). Each item needs <code>name</code>;
                other fields optional.
              </p>

              <!-- File picker -->
              <div class="form-group">
                <input type="file" accept="application/json,.json" @change="onFile" />
              </div>

              <!-- Raw textarea -->
              <div class="form-group">
                <textarea
                  v-model="importText"
                  rows="10"
                  placeholder='[{"name":"Example","website":"https://example.com","github":"https://github.com/example","symbol":"JTVO","contractAddress":"...","chainId":"solana","enabled":true}]'
                ></textarea>
              </div>

              <div class="modal-actions">
                <button @click="closeModal">Cancel</button>
                <button
                  class="primary"
                  :disabled="importing || !importText.trim()"
                  @click="onImport"
                >
                  <span v-if="importing" class="spinner"></span>
                  <span v-else>Import</span>
                </button>
              </div>
            </div>
          </div>

          <!-- RepoManager modal -->
          <div class="modal" :class="{ active: isActive('repos') }" :style="modalWidth ? { 'max-width': modalWidth } : {}" @click.self="modalClosable && closeModal()">
            <header class="modal-header">
              <h3 style="margin:0;font-size:1.1rem;">Manage Repos — {{ manageProject?.name }}</h3>
              <button type="button" class="modal-close-btn" aria-label="Close" @click="closeModal(); manageProject = null">×</button>
            </header>
            <div class="modal-body">
              <RepoManager
                v-if="manageProject"
                :projectId="manageProject.id"
                :githubUrl="manageProject.github_url"
                :projectName="manageProject.name"
                @repos-updated="closeModal(); manageProject = null"
              />
            </div>
          </div>

        </div>
      `,

      setup() {
        const projects   = ref([]);
        const loading   = ref(true);
        const error     = ref('');
        const editing   = ref(null);    // project being edited (null = create)
        const submitting = ref(false);

        function useModal() {
          const activeModal = ref(null);
          const modalWidth = ref('');
          const modalClosable = ref(true);
          function openModal(name, w, closable = false) {
            activeModal.value = name;
            modalWidth.value = w || '';
            modalClosable.value = closable;
          }
          function closeModal()    { activeModal.value = null; }
          function isActive(name)  { return activeModal.value === name; }
          return { activeModal, modalWidth, modalClosable, openModal, closeModal, isActive };
        }
        const { activeModal, modalWidth, modalClosable, openModal, closeModal, isActive } = useModal();
        function onEscClose() { closeModal(); }
        onMounted(() => document.addEventListener('modal:close', onEscClose));
        onUnmounted(() => document.removeEventListener('modal:close', onEscClose));

        const importText  = ref('');    // raw JSON string in the import textarea
        const importing   = ref(false);
        const manageProject = ref(null); // project for RepoManager modal
        const lastGithubImport = ref(null); // import-created project needing repo setup
        const projFilter = ref('');
        const selected = ref([]); // ids of selected projects for bulk ops

        const filteredProjects = computed(() => {
          const q = projFilter.value.toLowerCase();
          if (!q) return projects.value;
          return projects.value.filter(p =>
            p.name.toLowerCase().includes(q) ||
            (p.website_url || '').toLowerCase().includes(q) ||
            (p.github_url || '').toLowerCase().includes(q)
          );
        });

        /** Fetch all projects from the API */
        async function load() {
          loading.value = true;
          error.value   = '';
          try {
            projects.value = await api.listProjects();
          } catch (e) {
            error.value = e.message;
          } finally {
            loading.value = false;
          }
        }

        function openCreate(w) {
          editing.value = null;
          openModal('form', w);
        }
        function openEdit(p, w) {
          editing.value = p;
          editBus.value = null;
          openModal('form', w);
        }
        function openManageRepos(p, w) {
          manageProject.value = p;
          openModal('repos', w);
        }

        /** Create or update a project, then reload the list */
        async function onFormSubmit(payload) {
          submitting.value = true;
          error.value      = '';
          try {
            if (editing.value) {
              await api.updateProject(editing.value.id, payload);
            } else {
              const created = await api.createProject(payload);
              if (payload.github_url) {
                const fresh = projects.value.find(p => p.id === created.id);
                if (fresh) openManageRepos(fresh);
              }
            }
            closeModal();
            editing.value   = null;
            await load();
          } catch (e) {
            error.value = e.message;
          } finally {
            submitting.value = false;
          }
        }

        /** Delete a project after user confirmation */
        async function onDelete(p) {
          const msg = `Delete "${p.name}"? This removes its repos and check logs.`;
          if (!confirm(msg)) return;
          try {
            await api.deleteProject(p.id);
            await load();
          } catch (e) {
            error.value = e.message;
          }
        }

        /** Toggle selection of a single project */
        function toggleSelect(id) {
          const idx = selected.value.indexOf(id);
          if (idx >= 0) selected.value.splice(idx, 1);
          else selected.value.push(id);
        }

        /** Select or deselect all visible projects */
        function toggleSelectAll() {
          if (selected.value.length === filteredProjects.value.length) {
            selected.value = [];
          } else {
            selected.value = filteredProjects.value.map(p => p.id);
          }
        }

        /** Enable all selected projects */
        async function onBulkEnable() {
          if (!selected.value.length) return;
          error.value = '';
          await Promise.all(selected.value.map(id => api.updateProject(id, { enabled: 1 })));
          selected.value = [];
          await load();
        }

        /** Disable all selected projects */
        async function onBulkDisable() {
          if (!selected.value.length) return;
          error.value = '';
          await Promise.all(selected.value.map(id => api.updateProject(id, { enabled: 0 })));
          selected.value = [];
          await load();
        }

        /** Delete all selected projects after confirmation */
        async function onBulkDelete() {
          if (!selected.value.length) return;
          const n = selected.value.length;
          if (!confirm(`Delete ${n} project${n > 1 ? 's' : ''}? This removes their repos and check logs.`)) return;
          error.value = '';
          await Promise.all(selected.value.map(id => api.deleteProject(id)));
          selected.value = [];
          await load();
        }

        /**
         * Import one or more projects from the JSON textarea.
         * Accepts a single object or an array of objects.
         * Field mapping (import format → API):
         *   name,  website,  github,  twitter,  telegram
         */
        async function onImport() {
          let parsed;
          try {
            parsed = JSON.parse(importText.value);
          } catch (e) {
            error.value = 'Invalid JSON: ' + e.message;
            return;
          }
          const list = Array.isArray(parsed) ? parsed : [parsed];

          importing.value = true;
          error.value     = '';
          let ok = 0, failed = 0;

          for (const item of list) {
            try {
              // Normalize URL cols: support both string ("https://...") and object ({ url, cc, pc }) formats
              const websiteVal = item.website;
              const githubVal = item.github;
              const twitterVal = item.twitter;
              const hasWebsite = !!(websiteVal && (websiteVal.url || websiteVal));
              // token: prefer full object, fall back to individual fields
              const tok = item.token
                || (item.symbol || item.contractAddress || item.chainId
                    ? { symbol: item.symbol || null, contract: item.contractAddress || null, chain: item.chainId || null }
                    : null);
              const created = await api.createProject({
                name:                   item.name,
                website_url:            websiteVal?.url ?? websiteVal ?? null,
                website_content_check:  item.website_enabled !== undefined
                  ? (item.website_enabled ? 1 : 0)
                  : (websiteVal?.cc ?? (hasWebsite ? 1 : 0)),
                github_url:             githubVal?.url ?? githubVal ?? null,
                twitter_url:            twitterVal?.url ?? twitterVal ?? null,
                twitter_enabled:        item.twitter_enabled !== undefined
                  ? (item.twitter_enabled ? 1 : 0)
                  : (twitterVal?.pc ?? 1),
                twitter_posts_check:    item.twitter_posts_check !== undefined
                  ? (item.twitter_posts_check ? 1 : 0)
                  : (twitterVal?.pc ?? 1),
                telegram_url:           item.telegram?.url ?? item.telegram ?? null,
                website_enabled:        item.website_enabled  !== undefined ? (item.website_enabled  ? 1 : 0) : hasWebsite,
                github_enabled:         item.github_enabled   !== undefined ? (item.github_enabled   ? 1 : 0) : 1,
                telegram_enabled:       item.telegram_enabled !== undefined ? (item.telegram_enabled ? 1 : 0) : 1,
                token:                  tok,
                enabled:                item.enabled        !== undefined ? (item.enabled        ? 1 : 0) : 1,
                price_enabled:          item.price_enabled   !== undefined ? (item.price_enabled   ? 1 : 0) : 1,
              });
              // Restore repos if present
              if (Array.isArray(item.repos) && item.repos.length) {
                await api.addRepos(created.id, item.repos);
              }
              ok++;
              if (item.github) lastGithubImport.value = created;
            } catch (e) {
              failed++;
            }
          }

          importing.value   = false;
          closeModal();
          importText.value    = '';
          if (failed) error.value = `Imported ${ok}, ${failed} failed.`;
          await load();
          if (lastGithubImport.value) {
            const fresh = projects.value.find(p => p.id === lastGithubImport.value.id);
            if (fresh) openManageRepos(fresh);
            lastGithubImport.value = null;
          }
        }

        /** Export all projects as JSON (same format as import, with repos) */
        async function exportProjects() {
          const withRepos = await Promise.all(projects.value.map(async p => {
            const t = tok(p);
            const w = col(p, 'website');
            const g = col(p, 'github');
            const tw = col(p, 'twitter');
            const tg = col(p, 'telegram');
            const projectRepos = p.repos || await api.getProjectRepos(p.id);
            const repos = projectRepos.map(r => ({
              full_name: r.full_name,
              repo_url:  r.repo_url,
            }));
            return {
              name:            p.name,
              website:         w,
              github:          g,
              twitter:         tw,
              telegram:        tg,
              token:           t,
              enabled:         p.enabled,
              website_enabled:  p.website_enabled ? 1 : 0,
              github_enabled:   p.github_enabled  ? 1 : 0,
              twitter_enabled:  p.twitter_enabled ? 1 : 0,
              twitter_posts_check: p.twitter_posts_check ? 1 : 0,
              telegram_enabled: p.telegram_enabled ? 1 : 0,
              price_enabled:   p.price_enabled   ? 1 : 0,
              repos,
            };
          }));
          const blob = new Blob([JSON.stringify(withRepos, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'projects.json';
          a.click();
          URL.revokeObjectURL(a.href);
        }

        /** Read a File into the textarea via FileReader */
        function onFile(e) {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => { importText.value = String(reader.result || ''); };
          reader.readAsText(file);
        }

        onMounted(load);

        // Watch editBus so we catch edits triggered from other pages (e.g. card click on Activity)
        onMounted(() => { watch(editBus, (p) => { if (p) openEdit(p); }, { immediate: true }); });

        function tok(p) {
          return p.token ? (typeof p.token === 'string' ? JSON.parse(p.token) : p.token) : {};
        }
        function col(p, key) {
          const v = p[key];
          if (!v) return null;
          return typeof v === 'string' ? JSON.parse(v) : v;
        }

        return {
          projects, filteredProjects, loading, error, editing, submitting,
          importText, importing, manageProject, lastGithubImport,
          activeModal, modalWidth, modalClosable, isActive,
          projFilter, selected,
          openCreate, openEdit, openManageRepos, openModal, closeModal,
          onFormSubmit, onDelete, onImport, onFile, exportProjects,
          urlLabel, tok, projectIconLink, trimName,
          toggleSelect, toggleSelectAll, onBulkEnable, onBulkDisable, onBulkDelete,
          api: window.api,
        };
      },
    };

          showDangerZone:           false,
          compact_activity:         false,
          logs_per_page:           20,
          logs_per_page_enabled:  false,
          github_alert_minutes:       60,
          github_alert_stop_minutes:  1440,
          website_alert_minutes:      60,
          website_alert_stop_minutes:  1440,
          twitter_alert_minutes:       60,
          twitter_alert_stop_minutes:  1440,
          github_token:               '',
          telegram_enabled:         false,
          telegram_bot_token:       '',
          telegram_chat_id:         '',
          pushbullet_enabled:       false,
          pushbullet_access_token:  '',
          price_alerts: [
            { price_for: '6h', price_change: 10, price_interval: 5, enabled: 1, telegram: 1, pushbullet: 1, _enabled: true, _telegram: true, _pushbullet: true },
            { price_for: '6h', price_change: 25, price_interval: 15, enabled: 1, telegram: 1, pushbullet: 1, _enabled: true, _telegram: true, _pushbullet: true },
            { price_for: '6h', price_change: 50, price_interval: 60, enabled: 1, telegram: 1, pushbullet: 1, _enabled: true, _telegram: true, _pushbullet: true },
          ],
        });
        const loading   = ref(true);
        const saving    = ref(false);
        const triggering = ref(null);  // which trigger is running: 'web' | 'gh' | 'tw'
        const clearing  = ref(false);
        const clearingLogs  = ref(false);
        const clearingAlerts = ref(false);

        /**
         * Extract the interval (in minutes) for a given check type from the settings object.
         * Tries several possible response shapes for backwards compatibility.
         */
        function pickMinutes(s, kind) {
          if (!s) return 360;
          // Flat shape: { github_check_minutes: 360, website_check_minutes: 1440, ... }
          const d = s[kind + '_check_minutes'];
          if (d != null) return d;
          // Backward compat: commit_check_minutes
          if (kind === 'github' || kind === 'commit') {
            const b = s.commit_check_minutes;
            if (b != null) return b;
          }
          return 360;
        }

        /** Load settings from GET /api/settings */
        async function load() {
          loading.value = true;
          try {
            settings.value = await api.getSettings();
            form.value = {
              github_interval_minutes:   pickMinutes(settings.value, 'github'),
              website_interval_minutes:  pickMinutes(settings.value, 'website'),
              twitter_interval_minutes: pickMinutes(settings.value, 'twitter'),
              log_retention_days:   settings.value.log_retention_days || 7,
              event_log_retention_days:  settings.value.event_log_retention_days ?? 14,
              alert_log_retention_days:  settings.value.alert_log_retention_days ?? 14,
              twitter_posts_per_project: settings.value.twitter_posts_per_project ?? 50,
              ui_refresh_seconds:    settings.value.ui_refresh_seconds || 60,
              ui_refresh_enabled:    !!settings.value.ui_refresh_seconds,
              compact_activity:     !!settings.value.compact_activity,
              checks_on_new_project: !!settings.value.checks_on_new_project,
              logs_per_page:       settings.value.logs_per_page || 20,
              logs_per_page_enabled: settings.value.logs_per_page != null && settings.value.logs_per_page !== 20,
              github_alert_minutes:      settings.value.github_alert_minutes ?? 60,
              github_alert_stop_minutes:  settings.value.github_alert_stop_minutes ?? 1440,
              website_alert_minutes:      settings.value.website_alert_minutes ?? 60,
              website_alert_stop_minutes:  settings.value.website_alert_stop_minutes ?? 1440,
              twitter_alert_minutes:      settings.value.twitter_alert_minutes ?? 60,
              twitter_alert_stop_minutes:  settings.value.twitter_alert_stop_minutes ?? 1440,
              github_token:              settings.value.github_token || '',
              telegram_enabled:         !!settings.value.telegram?.enabled,
              telegram_bot_token:        settings.value.telegram?.bot_token || '',
              telegram_chat_id:          settings.value.telegram?.chat_id || '',
              pushbullet_enabled:       !!settings.value.pushbullet?.enabled,
              pushbullet_access_token:   settings.value.pushbullet?.access_token || '',
              price_alerts: (settings.value.price_alerts?.alerts || []).map(a => ({
                price_for:    a.price_for ?? '6h',
                price_change: a.price_change ?? 10,
                price_interval: a.price_interval ?? 5,
                enabled:        a.enabled ?? 1,
                telegram:       a.telegram ?? 1,
                pushbullet:     a.pushbullet ?? 0,
                _enabled:    !!(a.enabled ?? 1),
                _telegram:   !!(a.telegram ?? 1),
                _pushbullet: !!(a.pushbullet ?? 0),
              })),
            };
            sharedSettings.value = settings.value;
          } catch (e) {
            showToast(e.message, 'error', 5000);
          } finally {
            loading.value = false;
          }
        }

        /** Save updated intervals via PUT /api/settings */
        async function onSave() {
          saving.value = true;
          try {
            settings.value = await api.updateSettings({
              github_check_minutes:  Number(form.value.github_interval_minutes),
              website_check_minutes: Number(form.value.website_interval_minutes),
              twitter_check_minutes: Number(form.value.twitter_interval_minutes),
              log_retention_days:    Number(form.value.log_retention_days),
            });
            showToast('Saved.');
          } catch (e) {
            showToast(e.message, 'error', 5000);
          } finally {
            saving.value = false;
          }
        }

        // ponytail: shared save wrapper — all four save functions follow the same try/catch/finally shape
        async function saveSettings(payload) {
          saving.value = true;
          try {
            settings.value = await api.updateSettings(payload);
            sharedSettings.value = settings.value;
            showToast('Saved.');
          } catch (e) {
            showToast(e.message, 'error', 5000);
          } finally {
            saving.value = false;
          }
        }

        /** Save App Settings (excludes log retention — handled by saveCleanUpSettings) */
        async function saveAppSettings() {
          await saveSettings({
            github_token: form.value.github_token,
            ui_refresh_seconds: form.value.ui_refresh_enabled
              ? Number(form.value.ui_refresh_seconds) || 60
              : 0,
            compact_activity: form.value.compact_activity ? 1 : 0,
            checks_on_new_project: form.value.checks_on_new_project ? 1 : 0,
            logs_per_page: form.value.logs_per_page_enabled
              ? Number(form.value.logs_per_page) || 20
              : 20,
          });
        }

        /** Save Database CleanUp settings (log retention + twitter posts cap) */
        async function saveCleanUpSettings() {
          await saveSettings({
            log_retention_days: Math.max(1, Math.min(7, Number(form.value.log_retention_days) || 7)),
            event_log_retention_days: Math.max(10, Math.min(60, Number(form.value.event_log_retention_days) || 14)),
            alert_log_retention_days: Math.max(10, Math.min(30, Number(form.value.alert_log_retention_days) || 14)),
            twitter_posts_per_project: Math.max(50, Math.min(100, Number(form.value.twitter_posts_per_project) || 50)),
          });
        }

        /** Save Alert Settings */
        async function saveAlertSettings() {
          await saveSettings({
            github_alert_minutes:      Number(form.value.github_alert_minutes),
            github_alert_stop_minutes:  Number(form.value.github_alert_stop_minutes),
            website_alert_minutes:      Number(form.value.website_alert_minutes),
            website_alert_stop_minutes:  Number(form.value.website_alert_stop_minutes),
            twitter_alert_minutes:      Number(form.value.twitter_alert_minutes),
            twitter_alert_stop_minutes:  Number(form.value.twitter_alert_stop_minutes),
          });
        }

        /** Save Notification Channels (Telegram + Pushbullet) */
        async function saveNotificationSettings() {
          await saveSettings({
            telegram: {
              enabled:   form.value.telegram_enabled,
              bot_token: form.value.telegram_bot_token,
              chat_id:   form.value.telegram_chat_id,
            },
            pushbullet: {
              enabled:      form.value.pushbullet_enabled,
              access_token: form.value.pushbullet_access_token,
            },
          });
        }

        /** Save Price Alerts */
        async function savePriceAlertsSettings() {
          await saveSettings({
            price_alerts: {
              alerts: form.value.price_alerts.map(a => ({
                price_for:    a.price_for,
                price_change:   a.price_change,
                price_interval: a.price_interval,
                enabled:        a.enabled,
                telegram:       a.telegram,
                pushbullet:     a.pushbullet,
              })),
            },
          });
        }

        /** Run trigger-all for a specific kind (web / gh / tw) */
        async function onTrigger(kind, fn) {
          triggering.value = kind;
          try {
            await fn();
          } catch (e) {
            showToast(e.message, 'error', 5000);
          } finally {
            triggering.value = null;
          }
        }

        /** Clear check logs only, keep projects and repos */
        async function onClearLogs() {
          if (!confirm('Delete all check logs?')) return;
          clearingLogs.value = true;
          try {
            await api.clearLogs();
          } catch (e) {
            showToast(e.message, 'error', 5000);
          } finally {
            clearingLogs.value = false;
          }
        }

        /** Clear alert logs only */
        async function onClearAlerts() {
          if (!confirm('Delete all alert logs?')) return;
          clearingAlerts.value = true;
          try {
            await api.clearAlertLogs();
          } catch (e) {
            showToast(e.message, 'error', 5000);
          } finally {
            clearingAlerts.value = false;
          }
        }

        /** Delete all projects/repos/logs but keep the config row */
        async function onClear() {
          const msg = 'Delete all projects, repos and check logs? Config will be kept.';
          if (!confirm(msg)) return;
          clearing.value = true;
          try {
            await api.clearData();
            window.location.reload();
          } catch (e) {
            showToast(e.message, 'error', 5000);
            clearing.value = false;
          }
        }

        onMounted(load);

        return {
          settings, form, loading, saving, triggering, clearing, clearingLogs, clearingAlerts,
          onSave, saveAppSettings, saveAlertSettings, saveCleanUpSettings, saveNotificationSettings, savePriceAlertsSettings, onTrigger, onClear, onClearLogs, onClearAlerts,
          relativeTime,
          api: window.api,
        };
      },
    };

    /* ── Router ─────────────────────────────────────────────────────────────────
       Simple hash-based SPA router.
       Hash format: '' or '/' → ActivityPage, '/projects' → ProjectsPage,
       '/settings' → SettingsPage.
       Uses Vue's <component :is="..." /> to swap views.
    ───────────────────────────────────────────────────────────────────────── */
    const routes = {
      '/':          ActivityPage,
      '/projects':  ProjectsPage,
      '/settings':  SettingsPage,
      '/login':     LoginPage,
      '/register':  RegisterPage,
    };

    function hashRouter() {
      const route = window.location.hash.slice(1) || '/';
      const isAuthRoute = route === '/login' || route === '/register';
      // Redirect to login if no user and trying to access a protected route
      if (!currentUser.value && !isAuthRoute) {
        return { render() { return LoginPage; } };
      }
      // Redirect to home if logged in and trying to access auth pages
      if (currentUser.value && isAuthRoute) {
        return { render() { return ActivityPage; } };
      }
      return { render() { return routes[route] || routes['/']; } };
    }

    /* ── Root App component ────────────────────────────────────────────────────
       Composes NavBar + the current page view, with a fade transition between views.
    ───────────────────────────────────────────────────────────────────────── */
    const App = {
      components: { NavBar },

      setup() {
        const iframeUrl     = ref('');
        const iframeTitle   = ref('');
        const iframeLoading = ref(false);
        const iframeActive  = ref(false);
        const iframeWidth   = ref('');
        const iframeClosable = ref(false);
        const currentView   = ref(hashRouter().render());

        function openIframe(url, title = '', w = '', closable = false) {
          iframeUrl.value = url;
          iframeTitle.value = title;
          iframeLoading.value = true;
          iframeWidth.value = w;
          iframeClosable.value = closable;
          iframeActive.value = true;
        }
        function closeIframe() {
          iframeActive.value = false;
          iframeUrl.value = '';
        }

        provide('openIframe', openIframe);

        function onEsc(e) {
          if (e.key === 'Escape') {
            if (iframeActive.value) iframeActive.value = false;
            document.dispatchEvent(new CustomEvent('modal:close'));
          }
        }

        onMounted(() => {
          window.addEventListener('hashchange', () => {
            currentView.value = hashRouter().render();
          });
          document.addEventListener('keydown', onEsc);
        });
        onUnmounted(() => {
          document.removeEventListener('keydown', onEsc);
        });

        return { iframeUrl, iframeTitle, iframeLoading, iframeActive, iframeWidth, iframeClosable, closeIframe, currentView };
      },

      template: `
        <div>
          <NavBar />
          <transition name="fade" mode="out-in">
            <component :is="currentView" />
          </transition>

          <div class="modal-backdrop" :class="{ active: iframeActive }" @click="iframeClosable && closeIframe()"></div>

          <div class="modal modal-iframe" :class="{ active: iframeActive }" :style="iframeWidth ? { 'max-width': iframeWidth } : {}" @click.self="iframeClosable && closeIframe()">
            <header class="modal-header">
              <h3 style="margin:0;">{{ iframeTitle }}</h3>
              <button type="button" class="modal-close-btn" aria-label="Close" @click="closeIframe">×</button>
            </header>
            <div class="modal-body" style="padding:0; display:flex; flex-direction:column;">
              <div class="iframe-wrap" style="flex:1; min-height:0;">
                <div v-if="iframeLoading" class="center-loader"><span>Loading…</span></div>
                <iframe v-show="!iframeLoading" :src="iframeUrl" @load="iframeLoading = false" />
              </div>
            </div>
          </div>
        </div>
      `,
    };

    /* ── Bootstrap ───────────────────────────────────────────────────────────── */
    (async function init() {
      // Try to restore session from cookie
      try {
        const sess = await window.api.getSession();
        if (sess?.user) currentUser.value = sess.user;
      } catch (_) {}
      const app = createApp(App);
      app.mount('#app');
    })();
  </script>
</body>
</html>
